(function(){
 const slides=[...document.querySelectorAll('.slide')];let i=0;
 function go(n){i=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,k)=>{s.classList.toggle('on',k===i);if(k===i)s.scrollTop=0;});
  document.getElementById('prog').style.width=((i+1)/slides.length*100)+'%';
  document.getElementById('tag').textContent=(i+1)+' / '+slides.length;
  window.dispatchEvent(new CustomEvent('deck:go',{detail:i}));}
 document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(i+ +b.dataset.go));
 document.addEventListener('keydown',e=>{
  if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(i+1);}
  if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(i-1);}
  if(e.key==='Home')go(0);if(e.key==='End')go(slides.length-1);});
 let x0=null,y0=null;
 document.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY;},{passive:true});
 document.addEventListener('touchend',e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;
  if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy))go(i+(dx<0?1:-1));x0=null;},{passive:true});
 document.addEventListener('click',e=>{
  const h=e.target.closest('.hook');if(h&&h.querySelector('.reveal'))h.classList.toggle('open');
  const c=e.target.closest('.check');if(c&&c.tagName==='BUTTON')c.classList.toggle('hecho');
  const f=e.target.closest('.fila');if(f)f.classList.toggle('abierta');
  const o=e.target.closest('#op button');if(o){const box=document.getElementById('op');box.classList.add('resuelta');
   [...box.children].forEach(b=>b.classList.toggle('buena',b.dataset.ok==='1'));
   document.getElementById('sello').classList.add('puesto');}});
 document.getElementById('fs').onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});};
 go(0);
 window.deckGo=go;
})();



(function(){
 document.addEventListener('click',e=>{
  const o=e.target.closest('#op1 button');
  if(o){const b=document.getElementById('op1');b.classList.add('resuelta');[...b.children].forEach(x=>x.classList.toggle('buena',x.dataset.ok==='1'));document.getElementById('s1').classList.add('puesto');}

(function(){
 const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDF2asULlXoNiRFhGn-aqWjyNUBHBG_XhQ",
  authDomain: "sanbuenaventurahostel.firebaseapp.com",
  projectId: "sanbuenaventurahostel",
  storageBucket: "sanbuenaventurahostel.firebasestorage.app",
  messagingSenderId: "278880962197",
  appId: "1:278880962197:web:17a03c1cef0b603a727d9c"
};
 const DOM='sbhb.app', DOC='deck';
 const $=s=>document.querySelector(s);
 const slides=[...document.querySelectorAll('.slide')];
 const titulo=s=>{const h=s.querySelector('h1,h2');return h?h.textContent.trim():'Diapositiva';};
 let fb=null,rol=null,ultima=0,idx=0;
 const puntero=$('#puntero');
 window.addEventListener('deck:go',e=>{idx=e.detail;if(rol==='control')pinta();if(rol==='pantalla')return;});
 function pinta(){$('#m-ahora').textContent=titulo(slides[idx]);$('#m-sigue').textContent=slides[idx+1]?titulo(slides[idx+1]):'Fin de la presentación';$('#m-cont').textContent=(idx+1)+' de '+slides.length;}
 async function conectar(user,pass){
  const base='https://www.gstatic.com/firebasejs/10.12.2/';
  const [A,AU,F]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]);
  const app=A.initializeApp(FIREBASE_CONFIG),auth=AU.getAuth(app),db=F.getFirestore(app);
  await AU.signInWithEmailAndPassword(auth,user+'@'+DOM,pass);
  fb={F,db,ref:F.doc(db,'control',DOC)};
 }
 function escuchar(){fb.F.onSnapshot(fb.ref,s=>{if(!s.exists())return;const d=s.data();
   if(typeof d.slide==='number'&&d.slide!==idx)window.deckGo(d.slide);
   if(d.pointer){puntero.classList.add('on');puntero.style.left=(d.px*100)+'%';puntero.style.top=(d.py*100)+'%';}
   else puntero.classList.remove('on');});}
 function enviar(o){if(!fb)return;const ahora=Date.now();if(o.px!=null&&ahora-ultima<110)return;ultima=ahora;
   fb.F.setDoc(fb.ref,Object.assign({ts:ahora},o),{merge:true}).catch(()=>{});}
 function abrirPanel(){
  const d=document.createElement('div');d.className='panel';
  d.innerHTML=`<div class="pcaja"><h3>Control remoto</h3><p style="font-size:14px;color:var(--humo);max-width:none">Entra con tu usuario del sistema en el computador y en el celular. El celular manda y el computador obedece.</p>
   <label>Usuario</label><input id="c-user" autocapitalize="none" value="admin">
   <label>Contraseña</label><input id="c-pass" type="password">
   <p class="err" id="c-err"></p>
   <button class="btn" id="c-pantalla">Este equipo es la pantalla</button>
   <button class="btn sec" id="c-mando">Este equipo es mi control</button>
   <button class="cerrar" id="c-cerrar">Cancelar</button></div>`;
  document.body.appendChild(d);
  const cerrar=()=>d.remove();
  d.querySelector('#c-cerrar').onclick=cerrar;
  const entrar=async modo=>{
   const u=d.querySelector('#c-user').value.trim().toLowerCase(),p=d.querySelector('#c-pass').value;
   const err=d.querySelector('#c-err');err.textContent='Conectando…';
   if(!FIREBASE_CONFIG.apiKey){err.textContent='Falta pegar los datos de Firebase en este archivo.';return;}
   try{await conectar(u,p);}catch(e){err.textContent=(e&&e.code==='auth/invalid-credential')?'Usuario o contraseña incorrectos.':'No se pudo conectar ('+((e&&e.code)||'error')+').';return;}
   rol=modo;cerrar();$('#abrir').style.display='none';
   if(modo==='pantalla'){escuchar();}
   else{$('#mando').classList.add('on');pinta();enviar({slide:idx,pointer:false});}
  };
  d.querySelector('#c-pantalla').onclick=()=>entrar('pantalla');
  d.querySelector('#c-mando').onclick=()=>entrar('control');
 }
 $('#abrir').onclick=abrirPanel;
 $('#m-sig').onclick=()=>{idx=Math.min(slides.length-1,idx+1);pinta();enviar({slide:idx});};
 $('#m-atras').onclick=()=>{idx=Math.max(0,idx-1);pinta();enviar({slide:idx});};
 $('#m-salir').onclick=()=>{$('#mando').classList.remove('on');$('#abrir').style.display='';rol=null;enviar({pointer:false});};
 const pad=$('#pad');
 const mover=e=>{const t=e.touches?e.touches[0]:e,r=pad.getBoundingClientRect();
  const px=Math.min(1,Math.max(0,(t.clientX-r.left)/r.width)),py=Math.min(1,Math.max(0,(t.clientY-r.top)/r.height));
  enviar({px,py,pointer:true});};
 pad.addEventListener('touchstart',e=>{e.preventDefault();pad.classList.add('activo');mover(e);},{passive:false});
 pad.addEventListener('touchmove',e=>{e.preventDefault();mover(e);},{passive:false});
 pad.addEventListener('touchend',()=>{pad.classList.remove('activo');enviar({pointer:false});});
 pad.addEventListener('mousedown',e=>{pad.classList.add('activo');mover(e);
  const mv=ev=>mover(ev),up=()=>{pad.classList.remove('activo');enviar({pointer:false});document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);};
  document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);});
})();

.road.bad{box-shadow:inset 0 0 0 4px var(--danger)}
.road .lines{position:absolute;left:50%;top:0;bottom:0;width:0;border-left:4px dashed rgba(255,255,255,.65)}
.gate{position:absolute;left:0;right:0;top:6%;display:flex;gap:8px;padding:0 8px}
.gate .door{flex:1;background:#FFF;border:3px solid var(--accent);border-radius:10px;padding:10px 8px;font-weight:700;font-size:14px;text-align:center;min-height:62px;display:grid;place-items:center;cursor:pointer;color:var(--ink);font-family:inherit}
.car{position:absolute;bottom:14px;left:25%;transform:translateX(-50%);font-size:44px;transition:left .18s ease;line-height:1}
.ctrls{display:flex;gap:10px;margin-top:12px}
.ctrls .pad{flex:1;padding:16px;font-size:16px}
.small{font-size:12px}
.opt-btn{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:8px;font-size:15px;cursor:pointer}
.opt-btn:hover{border-color:var(--accent);background:#F2FAF9}
.opt-btn.file{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px}
.slider{width:100%;margin:12px 0 4px}
.warn{background:#FFF7E6;border-left:4px solid var(--warn);padding:8px 12px;border-radius:6px;margin:8px 0}
.ready{font-weight:700;color:var(--accent);text-align:center;margin-top:10px}
.slabel{font-weight:700;color:var(--accent)}
@media (max-width:700px){.page{padding:0 10px 50px}.card{padding:20px}}

async function firebaseBackend(){
  const base='https://www.gstatic.com/firebasejs/10.12.2/';
  const [A,AU,F]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]);
  const app=A.initializeApp(FIREBASE_CONFIG),auth=AU.getAuth(app),db=F.getFirestore(app);
  const mail=u=>u+'@'+DOMAIN;let unsub=null;
  return {mode:'firebase',
    init(onAuth){AU.onAuthStateChanged(auth,async u=>{if(unsub){unsub();unsub=null;}
      if(!u){onAuth(null);return;}
      const user=(u.email||'').split('@')[0];let name=user;
      try{const s=await F.getDoc(F.doc(db,'users',u.uid));if(s.exists())name=s.data().name||user;}catch(e){}
      onAuth({uid:u.uid,user,name});});},
    signIn:(user,pass)=>AU.signInWithEmailAndPassword(auth,mail(user),pass),
    async signUp(name,user,pass){const c=await AU.createUserWithEmailAndPassword(auth,mail(user),pass);
      await F.setDoc(F.doc(db,'users',c.user.uid),{id:c.user.uid,name,user,role:user===ADMIN_USER?'admin':'recepcion',active:true,practice:[],created:Date.now()},{merge:true});},
    signOut:()=>AU.signOut(auth),
    watch(adm,f){const q=adm?F.collection(db,'grades'):null;
      unsub=adm?F.onSnapshot(q,s=>{const m={};s.forEach(d=>m[d.id]=d.data());f(m);},e=>console.error(e))
               :F.onSnapshot(F.doc(db,'grades',auth.currentUser.uid),s=>f(s.exists()?{[s.id]:s.data()}:{}),e=>console.error(e));},
    save:(id,p)=>F.setDoc(F.doc(db,'grades',id),clone(p),{merge:true})};
}

function place(){const car=$('#car'),gate=$('#gate');if(!car)return;car.style.left=(RACE.lane?75:25)+'%';if(gate)gate.style.top=(6+RACE.y*72)+'%';}
function raceGo(){if(RACE.running)return;RACE.running=true;renderRace();let last=performance.now();
  const DUR=7000;
  const loop=t=>{const dt=t-last;last=t;RACE.y+=dt/DUR;
    if(RACE.y>=0.78){resolveGate();return;}
    place();raf=requestAnimationFrame(loop);};
  raf=requestAnimationFrame(loop);}
function resolveGate(){cancelAnimationFrame(raf);const g=RACE.gates[RACE.i];const pick=RACE.lane?g.right:g.left;
  A[g.id]=pick;const ok=pick===g.q.ok;if(ok)RACE.hits++;else RACE.crash++;
  RACE.flash=ok?'ok':'bad';RACE.running=false;renderRace();

    renderRace();setTimeout(()=>{if(PH.step==='race'&&!RACE.running)raceGo();},2200);},900);}

function perfil(r){const best=DAREAS.map(a=>{const x=r.areas[a]||{ok:0,n:1};return {a,p:x.ok/(x.n||1)};}).sort((x,y)=>y.p-x.p)[0];
  if(r.pct<50)return {n:'El Aprendiz',d:'Vas empezando y eso está bien: aquí se aprende haciendo.'};
  const M={Archivos:{n:'El Organizado',d:'Sabes dónde queda cada cosa. En recepción eso vale oro.'},Atajos:{n:'El Veloz',d:'Te mueves rápido en el computador. Vas a volar cuando haya fila.'},Formatos:{n:'El Preciso',d:'Sabes qué archivo mandar en cada caso.'},Excel:{n:'El Calculador',d:'Te defiendes con los números y las hojas de cálculo.'},Computador:{n:'El Práctico',d:'Resuelves lo del día a día sin enredarte.'}};
  return M[best.a]||{n:'El Práctico',d:'Te defiendes bien con las herramientas.'};}
function renderResult(d){
  const r=d.res||diagScore(d.a||{}),pf=perfil(r);
  $('#root').innerHTML=`<div class="page">${head()}<main class="content">
  <section class="q hero"><b class="big">${esc(pf.n)}</b><p>${esc(pf.d)}</p></section>
  <div class="kpis"><div class="kpi"><b>${r.level}</b><small>Tu nivel de entrada</small></div><div class="kpi"><b>${r.pct}%</b><small>${r.score} de ${r.total} correctas</small></div></div>
  <section class="q bars"><b>Por tema</b>${DAREAS.map(a=>{const x=r.areas[a]||{ok:0,n:1},p=Math.round(100*x.ok/(x.n||1));return `<div class="row"><span>${a}</span><div class="track"><div class="fill" style="width:${p}%"></div></div><b>${p}%</b></div>`;}).join('')}
  <p class="muted" style="margin-top:10px">${DLEVEL[r.level]}</p></section>
  <section class="q"><b>Tus respuestas</b>${DIAG.map(q=>{const v=(d.a||{})[q.id],ok=q.ok==null?null:+v===q.ok;
    return `<div class="rev"><span class="ic ${ok==null?'info':ok?'ok':'bad'}">${ok==null?'•':ok?'✓':'✗'}</span><div><b>${esc(q.q)}</b><small>Respondiste: ${v!=null?esc(q.o[v]):'sin responder'}${ok===false?'. Correcta: '+esc(q.o[q.ok]):''}</small></div></div>`;}).join('')}</section>
  <p class="muted">Ya el profesor tiene tus resultados.</p><button class="btn ghost" data-act="again">Volver a hacerlo</button></main></div>`;
}
function analisis(list){
  const fall={},sinResp={};
  DIAG.filter(q=>q.ok!=null).forEach(q=>{fall[q.id]=0;sinResp[q.id]=0;
    list.forEach(g=>{const v=g.diag.a[q.id];if(v==null)sinResp[q.id]++;else if(+v!==q.ok)fall[q.id]++;});});
  const pend=DIAG.filter(q=>q.ok!=null&&(fall[q.id]+sinResp[q.id])>0).sort((a,b)=>(fall[b.id]+sinResp[b.id])-(fall[a.id]+sinResp[a.id]));
  const dominados=DIAG.filter(q=>q.ok!=null&&(fall[q.id]+sinResp[q.id])===0);
  const porArea={};DAREAS.forEach(a=>porArea[a]={pend:0,tot:0});
  DIAG.filter(q=>q.ok!=null).forEach(q=>{porArea[q.a].tot++;if(fall[q.id]+sinResp[q.id]>0)porArea[q.a].pend++;});
  const orden=DAREAS.slice().sort((a,b)=>(porArea[b].pend/porArea[b].tot)-(porArea[a].pend/porArea[a].tot));
  const nivelMin=list.reduce((m,g)=>{const o={Inicial:0,Intermedio:1,Avanzado:2};return Math.min(m,o[g.diag.res.level]);},2);
  const soloCel=list.filter(g=>g.diag.a.x4===2);
  const sinExp=list.filter(g=>g.diag.a.x1===0);
  return {fall,sinResp,pend,dominados,porArea,orden,nivelMin,soloCel,sinExp};
}
const QTIP={c1:'Para qué sirve cada programa: Word escribe, Excel calcula, PowerPoint presenta.',c2:'Diferencia entre Guardar y Guardar como, con un ejemplo en vivo.',c3:'Dónde quedan las descargas y cómo buscar un archivo en el computador.',
 f1:'Cuándo mandar PDF y cuándo un editable, con la carta de confirmación.',f2:'Extensiones de archivo: qué programa abre cada una.',f3:'Qué es un CSV y cómo se pasa de un sistema a Excel.',f4:'Cómo abrir archivos sin tener el programa: Google Docs, visor en línea.',
 a1:'Cómo nombrar archivos: fecha al inicio, sin espacios raros, nombre que se entienda.',a2:'Estructura de carpetas por fecha y por área; ejercicio con la carpeta del turno.',a3:'Trabajo en la nube: guardado automático, versiones y respaldo.',
 e1:'Fórmula SUMA y rangos de celdas, paso a paso.',e2:'Filtros y ordenar datos en una lista larga.',e3:'Errores comunes de Excel y cómo leerlos.',
 s1:'Copiar, cortar y pegar con el teclado.',s2:'Deshacer y rehacer: la red de seguridad.',s3:'Buscar dentro de un documento o página con Ctrl+F.'};
function renderAdmin(){
  Object.values(G).forEach(g=>{if(g&&g.diag&&!g.diag.res)g.diag.res=diagScore(g.diag.a||{});});
  const list=Object.values(G).filter(g=>g&&g.diag&&g.user!==ADMIN_USER).sort((a,b)=>b.diag.res.pct-a.diag.res.pct);
  const prom=list.length?Math.round(list.reduce((s,g)=>s+g.diag.res.pct,0)/list.length):0;
  const porArea=DAREAS.map(a=>{const p=list.length?Math.round(list.reduce((s,g)=>{const x=g.diag.res.areas[a]||{ok:0,n:1};return s+100*x.ok/(x.n||1);},0)/list.length):0;return {a,p};}).sort((x,y)=>x.p-y.p);
  const pares=[];for(let i=0;i<Math.floor(list.length/2);i++)pares.push((list[i].name||list[i].user)+' con '+(list[list.length-1-i].name||list[list.length-1-i].user));
  const q=id=>DIAG.find(x=>x.id===id);
  $('#root').innerHTML=`<div class="page"><header class="top"><div><b>Resultados del diagnóstico</b><small>${esc(ME.name)}</small></div><span><button class="btn ghost sm" data-act="try">Ver el quiz</button> <button class="btn ghost sm" data-act="export">Exportar a Excel</button> <button class="btn ghost sm" data-act="logout">Salir</button></span></header>
  <main class="content">${!list.length?'<p class="muted">Todavía nadie ha enviado el taller.</p>':`
  <div class="kpis"><div class="kpi"><b>${list.length}</b><small>Lo han hecho</small></div><div class="kpi"><b>${prom}%</b><small>Promedio del grupo</small></div>${['Inicial','Intermedio','Avanzado'].map(l=>`<div class="kpi"><b>${list.filter(g=>g.diag.res.level===l).length}</b><small>Nivel ${l}</small></div>`).join('')}</div>
  <div class="cols"><section class="q bars"><b>Temas más flojos del grupo</b>${porArea.map(x=>`<div class="row"><span>${x.a}</span><div class="track"><div class="fill" style="width:${x.p}%"></div></div><b>${x.p}%</b></div>`).join('')}</section>
  <section class="q"><b>Parejas sugeridas</b><p class="muted" style="font-size:12px;margin:4px 0">El que más sabe con el que va empezando.</p>${pares.map(p=>`<div class="rev"><div>${esc(p)}</div></div>`).join('')||'<p class="muted">Hacen falta más estudiantes.</p>'}</section></div>
  ${(()=>{const an=analisis(list);const NIV=['Inicial','Intermedio','Avanzado'];
    return `<section class="q"><b class="big">Cómo arrancar la clase</b>
    <p><b>Punto de partida:</b> hay estudiantes en nivel ${NIV[an.nivelMin]}, así que la clase arranca desde ahí. Nadie debe quedarse atrás.</p>
    <p><b>Orden sugerido de los temas:</b> ${an.orden.map((a,i)=>`${i+1}. ${a} (${an.porArea[a].pend} de ${an.porArea[a].tot} puntos por reforzar)`).join(' · ')}</p>
    ${an.soloCel.length?`<p class="warn">⚠ ${an.soloCel.length} estudiante(s) solo tienen celular. Planea parejas o préstamo de equipo en la sala de sistemas.</p>`:''}
    ${an.sinExp.length?`<p class="warn">⚠ ${an.sinExp.length} nunca han trabajado en recepción. Los ejemplos hay que explicarlos desde cero.</p>`:''}
    </section>
    <section class="q"><b class="big">Temas que hay que dictar sí o sí</b>
    <p class="muted">Basta con que a uno le haya quedado mal para que el tema entre a clase. Ordenados por cuántos lo necesitan.</p>
    ${an.pend.length?an.pend.map(q=>{const n=an.fall[q.id]+an.sinResp[q.id];return `<div class="rev"><span class="ic bad">${n}</span><div><b>${esc(q.a)}: ${esc(q.q)}</b><small>Qué reforzar: ${esc(QTIP[q.id]||'')} Respuesta correcta: ${esc(q.o[q.ok])}.</small></div></div>`;}).join(''):'<p class="muted">Nadie falló nada. Puedes acelerar y meter retos extra.</p>'}
    ${an.dominados.length?`<p class="muted" style="margin-top:10px"><b>Ya lo dominan todos (${an.dominados.length}):</b> ${an.dominados.map(q=>esc(q.a+' — '+q.o[q.ok])).join(' · ')}. Repásalo rápido y sigue.</p>`:''}
    </section>
    <section class="q"><b class="big">Estudiante por estudiante</b>
    ${list.map(g=>{const r=g.diag.res,flojas=DAREAS.filter(a=>{const x=r.areas[a]||{ok:0,n:1};return x.ok/(x.n||1)<0.6;}),fuertes=DAREAS.filter(a=>{const x=r.areas[a]||{ok:0,n:1};return x.ok/(x.n||1)===1;});
      const val=id=>{const q=DIAG.find(x=>x.id===id),v=g.diag.a[id];return v!=null?q.o[v]:'—';};
      const sug=r.level==='Inicial'?'Acompañamiento cercano: siéntalo adelante y verifica cada paso.':r.level==='Intermedio'?'Puede avanzar solo, pero revísale los puntos flojos.':'Puede ser monitor de un compañero y hacer los retos extra.';
      return `<div class="rev"><span class="ic ${r.level==='Inicial'?'bad':r.level==='Intermedio'?'info':'ok'}">${r.pct}</span><div><b>${esc(g.name||g.user)} — ${r.level}</b>
      <small>Fuerte en: ${fuertes.length?esc(fuertes.join(', ')):'nada todavía'}. Reforzar: ${flojas.length?esc(flojas.join(', ')):'ninguna área crítica'}.</small>
      <small>Recepción: ${esc(val('x1'))}. Programas: ${esc(val('x2'))}. Computador: ${esc(val('x3'))}. Equipo: ${esc(val('x4'))}.</small>
      <small><b>Sugerencia:</b> ${esc(sug)}</small></div></div>`;}).join('')}
    </section>`;})()}
  <section class="q scroll"><table class="tbl"><thead><tr><th>Estudiante</th><th>Nivel</th><th class="num">Puntaje</th>${DAREAS.map(a=>`<th class="num">${a}</th>`).join('')}<th>Recepción</th><th>Programas</th><th>Computador</th><th>Equipo</th></tr></thead><tbody>
  ${list.map(g=>{const d=g.diag,val=id=>{const v=d.a[id];return v!=null?esc(q(id).o[v]):'—';};
   return `<tr><td><b>${esc(g.name||g.user)}</b><br><small>${esc(g.user||'')}</small></td><td>${d.res.level}</td><td class="num">${d.res.pct}%</td>${DAREAS.map(a=>{const x=d.res.areas[a]||{ok:0,n:0};return `<td class="num">${x.ok}/${x.n}</td>`;}).join('')}<td>${val('x1')}</td><td>${val('x2')}</td><td>${val('x3')}</td><td>${val('x4')}</td></tr>`;}).join('')}
  </tbody></table></section>`}</main></div>`;
}

const ACTS={
 tab(el){tab=el.dataset.t;render();},
 logout(){B.signOut();},
 go(el){PH.step=el.dataset.s;RACE=null;renderQuiz();},
 'race-go'(){raceGo();},
 lane(el){if(RACE){RACE.lane=+el.dataset.l;place();}},
 pick(el){A[el.dataset.id]=+el.dataset.j;const list=PH.cardSet==='files'?FILEQ:CARDQ;PH.ci=(PH.ci||0)+1;
  if(PH.ci>=list.length){if(PH.cardSet==='cards'){PH.cardSet='files';PH.ci=0;}else{PH.step='exp';}}
  renderQuiz();},
 finish(){FORMS.diag(Object.assign({},A),null);},
 try(){preview=true;PH={step:'intro',cardSet:'cards',ci:0};RACE=null;A={};editing=true;render();},
 panel(){preview=false;editing=false;render();},
 again(){A={};PH={step:'intro',cardSet:'cards',ci:0};RACE=null;editing=true;render();},
 export(){const list=Object.values(G).filter(g=>g&&g.diag&&g.user!==ADMIN_USER);
  const selfq=DIAG.filter(q=>q.ok==null);
  const rows=[['Estudiante','Usuario','Nivel','Puntaje %'].concat(DAREAS,selfq.map(q=>q.q))].concat(list.map(g=>[g.name||'',g.user||'',g.diag.res.level,g.diag.res.pct].concat(DAREAS.map(a=>{const x=g.diag.res.areas[a]||{ok:0,n:0};return x.ok+'/'+x.n;}),selfq.map(q=>{const v=g.diag.a[q.id];return v!=null?q.o[v]:'';}))));
  const tsv=rows.map(r=>r.map(c=>String(c).replace(/[\t\n]/g,' ')).join('\t')).join('\n');
  $('#modal').innerHTML=`<div class="backdrop" data-act="close"><div class="card"><b>Exportar a Excel</b><p class="muted">Copia y pega en la celda A1 de Excel.</p><textarea id="tsv" rows="9" readonly>${esc(tsv)}</textarea><div class="row2"><button class="btn ghost" data-act="close">Cerrar</button><button class="btn" data-act="copy">Copiar</button></div></div></div>`;},
 close(el,e){if(el.classList.contains('backdrop')&&e.target!==el)return;$('#modal').innerHTML='';},
 copy(){const t=$('#tsv');t.focus();t.select();let ok=false;try{ok=document.execCommand('copy');}catch(e){}
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t.value).then(()=>toast('Datos copiados'),()=>toast(ok?'Datos copiados':'Selecciona el texto y copia con Ctrl+C',!ok));else toast(ok?'Datos copiados':'Selecciona el texto y copia con Ctrl+C',!ok);}
};
const err=(f,m)=>{const e=f.querySelector('.err');if(e)e.textContent=m;};
const FORMS={
 async login(d,f){try{await B.signIn(d.user.trim().toLowerCase(),d.pass);}catch(e){err(f,errMsg(e));}},
 async signup(d,f){const name=d.name.trim();const user=d.user.trim().toLowerCase().replace(/\s+/g,'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/^[._-]+|[._-]+$/g,'');
  if(!name)return err(f,'Escribe tu nombre.');
  if(!/^[a-z0-9]([a-z0-9._-]{1,28})?[a-z0-9]$/.test(user))return err(f,'El usuario debe empezar y terminar con letra o número, sin espacios ni tildes. Ejemplo: ana.lucia');
  if(d.pass.length<6)return err(f,'La contraseña debe tener al menos 6 caracteres.');
  if(d.pass!==d.pass2)return err(f,'Las contraseñas no coinciden.');
  try{await B.signUp(name,user,d.pass);}catch(e){err(f,errMsg(e));}},
 async diag(d,f){const faltan=DIAG.filter(q=>d[q.id]==null);
  if(faltan.length){toast(`Te faltan ${faltan.length} respuestas.`,true);return;}
  const a={};DIAG.forEach(q=>a[q.id]=+d[q.id]);const res=diagScore(a);
  const p={id:ME.uid,name:ME.name,user:ME.user,diag:{a,res,ts:Date.now()}};
  G[ME.uid]=Object.assign(G[ME.uid]||{},p);editing=false;A={};render();
  try{await B.save(ME.uid,p);toast('Listo, gracias. Ya el profesor tiene tus resultados.');}catch(e){toast(errMsg(e),true);}}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=ACTS[el.dataset.act];if(f)f(el,e);});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,d={};new FormData(f).forEach((v,k)=>{d[k]=v;});const id=f.dataset.form;if(FORMS[id])FORMS[id](d,f);});
document.addEventListener('input',e=>{const id=e.target.dataset.slider;if(id){A[id]=+e.target.value;const q=DIAG.find(x=>x.id===id),l=$('#sl-'+id);if(l)l.textContent=q.o[+e.target.value];}});
document.addEventListener('keydown',e=>{if(!RACE||PH.step!=='race')return;if(e.key==='ArrowLeft'){RACE.lane=0;place();}if(e.key==='ArrowRight'){RACE.lane=1;place();}if((e.key===' '||e.key==='Enter')&&!RACE.running){e.preventDefault();raceGo();}});

async function boot(){
  render();
  try{B=FIREBASE_CONFIG.apiKey?await firebaseBackend():demoBackend();}
  catch(e){console.error(e);$('#root').innerHTML=shell('<p>No se pudo conectar. Revisa tu conexión y la configuración de Firebase.</p>');return;}
  B.init(u=>{ME=u;G={};A={};editing=false;tab='in';render();if(u)B.watch(u.user===ADMIN_USER,g=>{G=Object.assign(G,g);render();});});
}
boot();
})();

<style>
:root{--bg:#F3F7F8;--panel:#FFFFFF;--ink:#1C2B30;--muted:#62757B;--line:#DCE6E8;--soft:#EDF4F5;--accent:#0E8C88;--ok:#1F9D5B;--warn:#D97706;--danger:#D93636;color-scheme:light}

.wrap{min-height:100%;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,#E4F4F2,#F3F7F8 60%)}

.stack{display:flex;flex-direction:column;gap:12px}

input,textarea{background:#FAFCFC;border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}

.rev:last-child{border-bottom:0}
.rev small{display:block;color:var(--muted);font-size:13px}
.ic{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:12px;background:var(--muted)}

.scroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line)}
.tbl .num{text-align:right;white-space:nowrap}
.backdrop{position:fixed;inset:0;background:rgba(28,43,48,.4);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.backdrop .card{max-width:640px}
.row2{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.toast{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;padding:12px 16px;border-radius:10px;font-weight:600;z-index:60;max-width:min(420px,calc(100% - 32px))}
.toast.err{background:var(--danger)}

.hero .big,.card-q .big{font-size:21px;line-height:1.3;display:block;margin-bottom:8px}
.steps{margin:10px 0 16px;padding-left:20px}
.steps li{margin-bottom:6px}
.prog{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin:6px 0 4px}
.pfill{height:100%;background:var(--accent);transition:width .3s}
.racehead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:6px}
.racehead b{font-size:17px}
.question{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-weight:700;margin:10px 0}
.road{position:relative;height:380px;border-radius:14px;overflow:hidden;background:linear-gradient(#5B6B70,#46565B);border:4px solid #C9D6D8}
.road.ok{box-shadow:inset 0 0 0 4px var(--ok)}
.road.bad{box-shadow:inset 0 0 0 4px var(--danger)}
.road .lines{position:absolute;left:50%;top:0;bottom:0;width:0;border-left:4px dashed rgba(255,255,255,.65)}
.gate{position:absolute;left:0;right:0;top:6%;display:flex;gap:8px;padding:0 8px}
.gate .door{flex:1;background:#FFF;border:3px solid var(--accent);border-radius:10px;padding:10px 8px;font-weight:700;font-size:14px;text-align:center;min-height:62px;display:grid;place-items:center;cursor:pointer;color:var(--ink);font-family:inherit}
.car{position:absolute;bottom:14px;left:25%;transform:translateX(-50%);font-size:44px;transition:left .18s ease;line-height:1}
.ctrls{display:flex;gap:10px;margin-top:12px}
.ctrls .pad{flex:1;padding:16px;font-size:16px}
.small{font-size:12px}
.opt-btn{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:8px;font-size:15px;cursor:pointer}
.opt-btn:hover{border-color:var(--accent);background:#F2FAF9}
.opt-btn.file{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px}
.slider{width:100%;margin:12px 0 4px}
.warn{background:#FFF7E6;border-left:4px solid var(--warn);padding:8px 12px;border-radius:6px;margin:8px 0}
.ready{font-weight:700;color:var(--accent);text-align:center;margin-top:10px}
.slabel{font-weight:700;color:var(--accent)}
@media (max-width:700px){.page{padding:0 10px 50px}.card{padding:20px}}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{background:#fff;border:2px solid var(--line);border-radius:10px;padding:10px 12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;cursor:pointer;text-align:left}
.chip:hover{border-color:var(--accent)}
.chip.sel{border-color:var(--accent);background:#E0F2F1;box-shadow:0 0 0 3px rgba(14,140,136,.18)}
.carpetas{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(210px,100%),1fr));gap:12px;margin-top:14px}
.carpeta{background:var(--panel);border:2px dashed var(--line);border-radius:14px;padding:14px;text-align:left;cursor:pointer;min-height:120px}
.carpeta.lista{border-color:var(--accent);background:#F2FAF9}
.carpeta .ico{font-size:26px;display:block}
.carpeta b{display:block;margin:4px 0}
.carpeta .cont{font-size:12px;color:var(--muted)}
.carpeta .dentro{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.mini{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;background:var(--soft);border-radius:6px;padding:4px 6px;color:var(--ink)}
.nombre{width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;padding:11px 12px;border:2px solid var(--line);border-radius:10px;background:#fff}
.nombre:focus{border-color:var(--accent);outline:none}
.mal{font-family:ui-monospace,Menlo,Consolas,monospace;background:#FBE9EC;border:1px solid #EFC3CC;color:#93304A;border-radius:10px;padding:10px 12px;font-size:13px;margin-top:6px}
code{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--soft);padding:2px 6px;border-radius:5px;font-size:.92em}
.hero .big{font-size:22px;display:block;margin-bottom:8px}
.steps{margin:10px 0 14px;padding-left:20px}.steps li{margin-bottom:6px}
.prog{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin:8px 0}
.pfill{height:100%;background:var(--accent);transition:width .3s}
.racehead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:6px}
.racehead b{font-size:17px}

async function firebaseBackend(){
  const base='https://www.gstatic.com/firebasejs/10.12.2/';
  const [A,AU,F]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]);
  const app=A.initializeApp(FIREBASE_CONFIG),auth=AU.getAuth(app),db=F.getFirestore(app);
  const mail=u=>u+'@'+DOMAIN;let unsub=null;
  return {mode:'firebase',
    init(onAuth){AU.onAuthStateChanged(auth,async u=>{if(unsub){unsub();unsub=null;}
      if(!u){onAuth(null);return;}
      const user=(u.email||'').split('@')[0];let name=user;
      try{const s=await F.getDoc(F.doc(db,'users',u.uid));if(s.exists())name=s.data().name||user;}catch(e){}
      onAuth({uid:u.uid,user,name});});},
    signIn:(user,pass)=>AU.signInWithEmailAndPassword(auth,mail(user),pass),
    async signUp(name,user,pass){const c=await AU.createUserWithEmailAndPassword(auth,mail(user),pass);
      await F.setDoc(F.doc(db,'users',c.user.uid),{id:c.user.uid,name,user,role:user===ADMIN_USER?'admin':'recepcion',active:true,practice:[],created:Date.now()},{merge:true});},
    signOut:()=>AU.signOut(auth),
    watch(adm,f){const q=adm?F.collection(db,'grades'):null;
      unsub=adm?F.onSnapshot(q,s=>{const m={};s.forEach(d=>m[d.id]=d.data());f(m);},e=>console.error(e))
               :F.onSnapshot(F.doc(db,'grades',auth.currentUser.uid),s=>f(s.exists()?{[s.id]:s.data()}:{}),e=>console.error(e));},
    save:(id,p)=>F.setDoc(F.doc(db,'grades',id),clone(p),{merge:true})};
}

  <section class="q hero"><b class="big">El turno anterior dejó un reguero</b>
  <p>Doce archivos tirados en el escritorio, con nombres imposibles. Tu trabajo: meter cada uno en su carpeta y después ponerle un nombre que sirva.</p>
  <ol class="steps"><li><b>Ordenar:</b> toca un archivo y luego la carpeta donde va.</li><li><b>Renombrar:</b> arregla tres nombres con el estándar del curso.</li></ol>
  <p class="muted">Estándar del curso: <code>AAAA-MM-DD_tema_detalle.extensión</code>, sin tildes, sin espacios, sin paréntesis.</p>
  <button class="btn big" data-act="empezar">Empezar</button></section></main></div>`;
}
function renderOrdenar(){
  const pend=ARCHIVOS.filter(a=>!J.ubic[a.id]);
  document.getElementById('root').innerHTML=`<div class="page">${head()}<main class="content">
  <div class="racehead"><b>1. Ordena el reguero</b><span class="muted">${ARCHIVOS.length-pend.length} de ${ARCHIVOS.length}</span></div>
  <div class="prog"><div class="pfill" style="width:${Math.round(100*(ARCHIVOS.length-pend.length)/ARCHIVOS.length)}%"></div></div>
  <p class="muted">Toca un archivo y después la carpeta donde debe ir.</p>
  <section class="q"><b>Archivos sueltos</b><div class="chips">${pend.length?pend.map(a=>`<button class="chip ${J.sel===a.id?'sel':''}" data-act="sel" data-id="${a.id}">📄 ${esc(a.n)}</button>`).join(''):'<p class="muted">¡Escritorio limpio!</p>'}</div></section>
  <div class="carpetas">${CARPETAS.map(c=>{const dentro=ARCHIVOS.filter(a=>J.ubic[a.id]===c.id);
    return `<button class="carpeta ${J.sel?'lista':''}" data-act="soltar" data-c="${c.id}"><span class="ico">${c.ico}</span><b>${c.n}</b><span class="cont">${dentro.length} archivo${dentro.length===1?'':'s'}</span>
    <span class="dentro">${dentro.map(a=>`<span class="mini" data-act="sacar" data-id="${a.id}">${esc(a.n.slice(0,26))}${a.n.length>26?'…':''}</span>`).join('')}</span></button>`;}).join('')}</div>
  ${pend.length?'':'<button class="btn big" data-act="revisar">Revisar y seguir</button>'}
  </main></div>`;
}
function renderNombrar(){
  document.getElementById('root').innerHTML=`<div class="page">${head()}<main class="content">
  <div class="racehead"><b>2. Ponles un nombre decente</b><span class="muted">${RENOMBRAR.length} archivos</span></div>
  <p class="muted">Usa el estándar: <code>AAAA-MM-DD_tema_detalle.extensión</code>. Sin tildes, sin espacios y sin paréntesis.</p>
  ${RENOMBRAR.map(r=>`<section class="q"><small class="muted">Se llama hoy</small><div class="mal">${esc(r.orig)}</div>
   <p style="margin:10px 0 4px"><b>${esc(r.pista)}</b></p>
   <input class="nombre" data-n="${r.id}" value="${esc(J.nombres[r.id]||'')}" placeholder="2026-10-03_tema_detalle.xlsx" autocapitalize="none" spellcheck="false"></section>`).join('')}
  <button class="btn big" data-act="terminar">Terminar</button></main></div>`;
}
function evaluar(){
  let bien=0;ARCHIVOS.forEach(a=>{if(J.ubic[a.id]===a.c)bien++;});
  const detalles=RENOMBRAR.map(r=>{const v=norm(J.nombres[r.id]);
    const fecha=v.startsWith(r.fecha);
    const claves=r.claves.every(k=>v.includes(k));
    const ext=new RegExp('\\.('+r.ext+')$').test(v);
    const limpio=!/[\s()áéíóúñ]/.test(J.nombres[r.id]||'x')&&/^[a-z0-9._-]+$/.test(v);
    const ok=fecha&&claves&&ext&&limpio;
    return {id:r.id,ok,fecha,claves,ext,limpio,valor:J.nombres[r.id]||''};});
  const okN=detalles.filter(d=>d.ok).length;
  const total=ARCHIVOS.length+RENOMBRAR.length,logro=bien+okN;
  const pct=Math.round(100*logro/total);
  const seg=Math.round((Date.now()-J.t0)/1000);
  return {bien,total:ARCHIVOS.length,okN,totalN:RENOMBRAR.length,pct,seg,detalles,errores:J.errores,ts:Date.now(),
    medalla:pct>=90?'Oro':pct>=70?'Plata':pct>=50?'Bronce':'Sigue practicando'};
}
function renderFin(){
  const r=J.res;
  document.getElementById('root').innerHTML=`<div class="page">${head()}<main class="content">
  <section class="q hero"><b class="big">${r.medalla}</b><p>Ordenaste bien ${r.bien} de ${r.total} archivos y renombraste bien ${r.okN} de ${r.totalN}. Te demoraste ${Math.floor(r.seg/60)} min ${r.seg%60} s.</p></section>
  <div class="kpis"><div class="kpi"><b>${r.pct}%</b><small>Puntaje</small></div><div class="kpi"><b>${r.errores}</b><small>Archivos movidos de carpeta</small></div></div>
  <section class="q"><b>Revisión del ordenado</b>${ARCHIVOS.map(a=>{const ok=J.ubic[a.id]===a.c,c=CARPETAS.find(x=>x.id===a.c);
    return `<div class="rev"><span class="ic ${ok?'ok':'bad'}">${ok?'✓':'✗'}</span><div><b>${esc(a.n)}</b><small>${ok?'Bien ubicado en '+c.n:'Va en '+c.n}</small></div></div>`;}).join('')}</section>
  <section class="q"><b>Revisión de los nombres</b>${r.detalles.map(d=>{const R=RENOMBRAR.find(x=>x.id===d.id);
    const fallas=[!d.fecha?'falta la fecha al inicio (AAAA-MM-DD)':'',!d.claves?'falta el tema en el nombre':'',!d.ext?'la extensión no corresponde':'',!d.limpio?'tiene espacios, tildes o caracteres raros':''].filter(Boolean);
    return `<div class="rev"><span class="ic ${d.ok?'ok':'bad'}">${d.ok?'✓':'✗'}</span><div><b>${esc(d.valor||'(vacío)')}</b><small>${d.ok?'Perfecto':'Corregir: '+fallas.join(', ')+'. Ejemplo: '+R.ej}</small></div></div>`;}).join('')}</section>
  <p class="muted">Tu resultado ya le llegó al profesor.</p><button class="btn ghost" data-act="otra">Volver a intentar</button></main></div>`;
}
function renderAdmin(){
  const list=Object.values(G).filter(g=>g&&g.carpeta&&g.user!==ADMIN_USER).sort((a,b)=>b.carpeta.pct-a.carpeta.pct);
  const prom=list.length?Math.round(list.reduce((s,g)=>s+g.carpeta.pct,0)/list.length):0;
  const fallos={};ARCHIVOS.forEach(a=>fallos[a.id]=0);
  document.getElementById('root').innerHTML=`<div class="page"><header class="top"><div><b>La Carpeta Caótica</b><small>Resultados</small></div><span><button class="btn ghost sm" data-act="try">Jugar</button> <button class="btn ghost sm" data-act="export">Exportar a Excel</button> <button class="btn ghost sm" data-act="logout">Salir</button></span></header>
  <main class="content">${!list.length?'<p class="muted">Todavía nadie ha jugado.</p>':`
  <div class="kpis"><div class="kpi"><b>${list.length}</b><small>Han jugado</small></div><div class="kpi"><b>${prom}%</b><small>Promedio</small></div>
  ${['Oro','Plata','Bronce'].map(m=>`<div class="kpi"><b>${list.filter(g=>g.carpeta.medalla===m).length}</b><small>${m}</small></div>`).join('')}</div>
  <section class="q scroll"><table class="tbl"><thead><tr><th>Estudiante</th><th>Medalla</th><th class="num">Puntaje</th><th class="num">Ordenado</th><th class="num">Nombres</th><th class="num">Tiempo</th></tr></thead><tbody>
  ${list.map(g=>{const c=g.carpeta;return `<tr><td><b>${esc(g.name||g.user)}</b><br><small>${esc(g.user||'')}</small></td><td>${c.medalla}</td><td class="num">${c.pct}%</td><td class="num">${c.bien}/${c.total}</td><td class="num">${c.okN}/${c.totalN}</td><td class="num">${Math.floor(c.seg/60)}:${String(c.seg%60).padStart(2,'0')}</td></tr>`;}).join('')}
  </tbody></table></section>`}</main></div>`;
}
const ACTS={
 tab(el){tab=el.dataset.t;render();},
 logout(){B.signOut();},
 panel(){preview=false;render();},
 try(){preview=true;nuevoJuego();render();},
 empezar(){J.fase='ordenar';J.t0=Date.now();render();},
 sel(el){J.sel=J.sel===+el.dataset.id?null:+el.dataset.id;render();},
 soltar(el){if(!J.sel)return;J.ubic[J.sel]=el.dataset.c;J.sel=null;render();},
 sacar(el){const id=+el.dataset.id;delete J.ubic[id];J.errores++;J.sel=id;render();},
 revisar(){J.fase='nombrar';render();},
 async terminar(){document.querySelectorAll('.nombre').forEach(i=>{J.nombres[i.dataset.n]=i.value.trim();});
  const faltan=RENOMBRAR.filter(r=>!J.nombres[r.id]);
  if(faltan.length){toast('Te faltan '+faltan.length+' nombres por escribir.',true);return;}
  J.res=evaluar();J.fase='fin';render();
  const p={id:ME.uid,name:ME.name,user:ME.user,carpeta:J.res};
  G[ME.uid]=Object.assign(G[ME.uid]||{},p);
  try{await B.save(ME.uid,p);}catch(e){toast(errMsg(e),true);}},
 otra(){nuevoJuego();render();},
 export(){const list=Object.values(G).filter(g=>g&&g.carpeta&&g.user!==ADMIN_USER);
  const rows=[['Estudiante','Usuario','Medalla','Puntaje %','Ordenado','Nombres','Tiempo (s)','Movimientos']].concat(list.map(g=>{const c=g.carpeta;return [g.name||'',g.user||'',c.medalla,c.pct,c.bien+'/'+c.total,c.okN+'/'+c.totalN,c.seg,c.errores];}));
  const tsv=rows.map(r=>r.join('\t')).join('\n');
  document.getElementById('modal').innerHTML=`<div class="backdrop" data-act="close"><div class="card"><b>Exportar a Excel</b><p class="muted">Copia y pega en la celda A1.</p><textarea id="tsv" rows="9" readonly>${esc(tsv)}</textarea><div class="row2"><button class="btn ghost" data-act="close">Cerrar</button><button class="btn" data-act="copy">Copiar</button></div></div></div>`;},
 close(el,e){if(el.classList.contains('backdrop')&&e.target!==el)return;document.getElementById('modal').innerHTML='';},
 copy(){const t=document.getElementById('tsv');t.focus();t.select();let ok=false;try{ok=document.execCommand('copy');}catch(e){}
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t.value).then(()=>toast('Datos copiados'),()=>toast(ok?'Datos copiados':'Cópialo con Ctrl+C',!ok));else toast(ok?'Datos copiados':'Cópialo con Ctrl+C',!ok);}
};
const err=(f,m)=>{const e=f.querySelector('.err');if(e)e.textContent=m;};
const FORMS={
 async login(d,f){try{await B.signIn(d.user.trim().toLowerCase(),d.pass);}catch(e){err(f,errMsg(e));}},
 async signup(d,f){const name=d.name.trim();const user=d.user.trim().toLowerCase().replace(/\s+/g,'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/^[._-]+|[._-]+$/g,'');
  if(!name)return err(f,'Escribe tu nombre.');
  if(!/^[a-z0-9]([a-z0-9._-]{1,28})?[a-z0-9]$/.test(user))return err(f,'El usuario debe empezar y terminar con letra o número, sin espacios ni tildes. Ejemplo: ana.lucia');
  if(d.pass.length<6)return err(f,'La contraseña debe tener al menos 6 caracteres.');
  if(d.pass!==d.pass2)return err(f,'Las contraseñas no coinciden.');
  try{await B.signUp(name,user,d.pass);}catch(e){err(f,errMsg(e));}}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=ACTS[el.dataset.act];if(f){e.stopPropagation();f(el,e);}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,d={};new FormData(f).forEach((v,k)=>{d[k]=v;});const id=f.dataset.form;if(FORMS[id])FORMS[id](d,f);});
document.addEventListener('input',e=>{if(e.target.classList.contains('nombre'))J.nombres[e.target.dataset.n]=e.target.value;});
async function boot(){
  render();
  try{B=FIREBASE_CONFIG.apiKey?await firebaseBackend():demoBackend();}
  catch(e){console.error(e);document.getElementById('root').innerHTML=shell('<p>No se pudo conectar. Revisa la configuración de Firebase.</p>');return;}
  B.init(u=>{ME=u;G={};preview=false;tab='in';nuevoJuego();render();if(u)B.watch(u.user===ADMIN_USER,g=>{G=Object.assign(G,g);render();});});
}
boot();
})();

</script><script type="text/plain" id="app-formatos"><!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#0A2E36">
<title>Formatos, tipos de archivo y nomenclatura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --noche:#0A2E36;--mar:#12878F;--espuma:#8FD3D0;--cal:#FBF6EE;--arena:#F0E6D6;
  --buganvilia:#C63A5E;--mostaza:#E8A33D;--tinta:#0E2226;--humo:#6B8085;
  --ff-d:"Bricolage Grotesque",Georgia,serif;--ff-b:Manrope,system-ui,sans-serif;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--noche)}
body{font-family:var(--ff-b);color:var(--tinta);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--mostaza);outline-offset:3px}

#deck{height:100%;position:relative;overflow:hidden}
.rail{position:absolute;top:0;left:0;right:0;height:4px;background:rgba(255,255,255,.18);z-index:9}
.rail i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mostaza),var(--espuma));transition:width .5s cubic-bezier(.22,1,.36,1)}
.slide{position:absolute;inset:0;overflow:auto;display:none;padding:clamp(22px,4vh,52px) clamp(20px,6vw,88px) 132px}
.slide.on{display:block}
.slide.light{background:var(--cal);color:var(--tinta)}
.slide.dark{background:radial-gradient(120% 100% at 80% 0%,#134651 0%,var(--noche) 60%);color:var(--cal)}
.slide.sand{background:linear-gradient(180deg,var(--arena),#F7EFE2);color:var(--tinta)}
.inner{max-width:1180px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;justify-content:center}

/* tipografía */
.eyebrow{font-family:var(--ff-b);font-weight:700;font-size:clamp(12px,1.4vw,15px);color:var(--buganvilia);margin:0 0 10px;letter-spacing:.01em}
.dark .eyebrow{color:var(--mostaza)}
h1{font-family:var(--ff-d);font-weight:800;font-size:clamp(34px,7vw,86px);line-height:.96;letter-spacing:-.03em;margin:0 0 18px}
h2{font-family:var(--ff-d);font-weight:800;font-size:clamp(26px,4.6vw,54px);line-height:1.02;letter-spacing:-.025em;margin:0 0 18px;max-width:20ch}
h3{font-family:var(--ff-d);font-weight:600;font-size:clamp(17px,2.1vw,24px);margin:0 0 4px;letter-spacing:-.01em}
p{font-size:clamp(15px,1.75vw,21px);line-height:1.55;margin:0 0 14px;max-width:58ch}
.lead{font-size:clamp(17px,2.2vw,27px);line-height:1.4;color:var(--humo);max-width:34ch}
.dark .lead{color:var(--espuma)}
.small{font-size:clamp(13px,1.4vw,16px);color:var(--humo)}
.dark .small{color:#9FC4C6}

/* entrada orquestada */
.slide.on .anim{animation:rise .62s cubic-bezier(.22,1,.36,1) both}
.slide.on .anim:nth-child(1){animation-delay:.02s}.slide.on .anim:nth-child(2){animation-delay:.1s}
.slide.on .anim:nth-child(3){animation-delay:.18s}.slide.on .anim:nth-child(4){animation-delay:.26s}
.slide.on .anim:nth-child(5){animation-delay:.34s}.slide.on .anim:nth-child(6){animation-delay:.42s}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.stagger>*{opacity:0}
.slide.on .stagger>*{animation:rise .55s cubic-bezier(.22,1,.36,1) both}
.slide.on .stagger>*:nth-child(1){animation-delay:.18s}.slide.on .stagger>*:nth-child(2){animation-delay:.26s}
.slide.on .stagger>*:nth-child(3){animation-delay:.34s}.slide.on .stagger>*:nth-child(4){animation-delay:.42s}
.slide.on .stagger>*:nth-child(5){animation-delay:.5s}.slide.on .stagger>*:nth-child(6){animation-delay:.58s}
.slide.on .stagger>*:nth-child(7){animation-delay:.66s}.slide.on .stagger>*:nth-child(8){animation-delay:.74s}

/* portada */
.hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(220px,.65fr);gap:clamp(20px,4vw,56px);align-items:center}
.hero h1{max-width:14ch}
.datos{display:flex;flex-wrap:wrap;gap:8px 28px;font-weight:600;color:var(--espuma);font-size:clamp(13px,1.5vw,18px);margin-top:6px}
.llavero{position:relative;height:clamp(180px,32vh,340px);display:grid;place-items:start center}
.llavero svg{width:clamp(120px,16vw,190px);transform-origin:50% 6%;animation:swing 5.5s ease-in-out infinite}
@keyframes swing{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}

/* tablero de llaves */
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:14px}
.hook{position:relative;text-align:left;background:var(--cal);border:1px solid rgba(14,34,38,.12);border-radius:4px 4px 16px 16px;padding:18px 20px 20px;box-shadow:0 10px 24px rgba(10,46,54,.07);transition:transform .25s cubic-bezier(.22,1,.36,1),box-shadow .25s}
.dark .hook{background:rgba(251,246,238,.06);border-color:rgba(143,211,208,.22);color:var(--cal);box-shadow:none}
.hook::before{content:"";position:absolute;top:-9px;left:24px;width:14px;height:14px;border-radius:50%;background:var(--mostaza);box-shadow:0 0 0 3px var(--cal)}
.dark .hook::before{box-shadow:0 0 0 3px var(--noche)}
.hook:hover,.hook:focus-visible{transform:translateY(-4px) rotate(-.6deg);box-shadow:0 16px 30px rgba(10,46,54,.12)}
.hook p{font-size:clamp(13px,1.5vw,17px);color:var(--humo);margin:0;max-width:34ch}
.dark .hook p{color:#A9CBCC}
.hook .reveal{display:none;margin-top:10px;font-weight:700;color:var(--buganvilia)}
.dark .hook .reveal{color:var(--mostaza)}
.hook.open .reveal{display:block;animation:rise .35s ease both}
.hook.open .pista{display:none}
.pista{margin-top:12px;font-size:13px;font-weight:700;color:var(--mar)}
.dark .pista{color:var(--espuma)}

/* cronograma */
.agenda{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(420px,100%),1fr))}
.fila{display:grid;grid-template-columns:118px 1fr;gap:4px 16px;align-items:center;padding:12px 16px;background:var(--cal);border-left:6px solid var(--mar);border-radius:0 12px 12px 0;text-align:left;width:100%}
.fila.v{border-left-color:var(--buganvilia);background:#FDF7F4}
.fila .cuando{font-family:var(--ff-d);font-weight:600;font-size:clamp(15px,1.7vw,20px)}
.fila .que{font-weight:700;font-size:clamp(14px,1.6vw,19px)}
.fila .det{display:block;font-weight:500;color:var(--humo);font-size:clamp(12px,1.4vw,15px);max-height:0;overflow:hidden;transition:max-height .3s ease}
.fila.abierta .det{max-height:60px}
.modo{font-size:12px;font-weight:700;color:var(--mar)}
.fila.v .modo{color:var(--buganvilia)}

/* árbol y comparación */
.arbol{font-family:ui-monospace,Menlo,Consolas,monospace;background:#0E3A43;color:var(--espuma);border-radius:14px;padding:clamp(16px,2.5vw,26px);font-size:clamp(12px,1.5vw,17px);line-height:1.85;box-shadow:inset 0 0 0 1px rgba(143,211,208,.18)}
.arbol b{color:var(--mostaza);font-weight:700}
.slide.on .arbol span{animation:linea .4s ease both}
.arbol span{display:block;opacity:0}
.slide.on .arbol span:nth-child(1){animation-delay:.3s}.slide.on .arbol span:nth-child(2){animation-delay:.45s}
.slide.on .arbol span:nth-child(3){animation-delay:.6s}.slide.on .arbol span:nth-child(4){animation-delay:.75s}
.slide.on .arbol span:nth-child(5){animation-delay:.9s}.slide.on .arbol span:nth-child(6){animation-delay:1.05s}
@keyframes linea{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
.duo{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:14px;margin-top:6px}
.mal,.bien{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:clamp(12px,1.5vw,16px);padding:14px 16px;border-radius:12px}
.mal{background:#FBE9EC;border:1px solid #EFC3CC;text-decoration:line-through;color:#93304A}
.bien{background:#E7F5F1;border:1px solid #B8DFD5;color:#14655A}

/* lista con chulos */
.checks{display:grid;gap:10px;max-width:60ch}

   <button class="btn sec" id="c-mando">Este equipo es mi control</button>
   <button class="cerrar" id="c-cerrar">Cancelar</button></div>`;

   rol=modo;cerrar();$('#abrir').style.display='none';
   if(modo==='pantalla'){escuchar();}
   else{$('#mando').classList.add('on');pinta();enviar({slide:idx,pointer:false});}

 const pad=$('#pad');

<script>
(function(){
 const slides=[...document.querySelectorAll('.slide')];let i=0;
 function go(n){i=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,k)=>{s.classList.toggle('on',k===i);if(k===i)s.scrollTop=0;});
  document.getElementById('prog').style.width=((i+1)/slides.length*100)+'%';
  document.getElementById('tag').textContent=(i+1)+' / '+slides.length;
  window.dispatchEvent(new CustomEvent('deck:go',{detail:i}));}
 document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(i+ +b.dataset.go));
 document.addEventListener('keydown',e=>{
  if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(i+1);}
  if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(i-1);}
  if(e.key==='Home')go(0);if(e.key==='End')go(slides.length-1);});
 let x0=null,y0=null;
 document.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY;},{passive:true});
 document.addEventListener('touchend',e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;
  if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy))go(i+(dx<0?1:-1));x0=null;},{passive:true});
 document.addEventListener('click',e=>{
  const h=e.target.closest('.hook');if(h&&h.querySelector('.reveal'))h.classList.toggle('open');
  const c=e.target.closest('.check');if(c&&c.tagName==='BUTTON')c.classList.toggle('hecho');
  const f=e.target.closest('.fila');if(f)f.classList.toggle('abierta');
  const o=e.target.closest('#op button');if(o){const box=document.getElementById('op');box.classList.add('resuelta');
   [...box.children].forEach(b=>b.classList.toggle('buena',b.dataset.ok==='1'));
   document.getElementById('sello').classList.add('puesto');}});
 document.getElementById('fs').onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});};
 go(0);
 window.deckGo=go;
})();

/* ---------- Control remoto por Firebase ---------- */
(function(){
 const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDF2asULlXoNiRFhGn-aqWjyNUBHBG_XhQ",
  authDomain: "sanbuenaventurahostel.firebaseapp.com",
  projectId: "sanbuenaventurahostel",
  storageBucket: "sanbuenaventurahostel.firebasestorage.app",
  messagingSenderId: "278880962197",
  appId: "1:278880962197:web:17a03c1cef0b603a727d9c"
};
 const DOM='sbhb.app', DOC='deck';
 const $=s=>document.querySelector(s);
 const slides=[...document.querySelectorAll('.slide')];
 const titulo=s=>{const h=s.querySelector('h1,h2');return h?h.textContent.trim():'Diapositiva';};
 let fb=null,rol=null,ultima=0,idx=0;
 const puntero=$('#puntero');
 window.addEventListener('deck:go',e=>{idx=e.detail;if(rol==='control')pinta();if(rol==='pantalla')return;});
 function pinta(){$('#m-ahora').textContent=titulo(slides[idx]);$('#m-sigue').textContent=slides[idx+1]?titulo(slides[idx+1]):'Fin de la presentación';$('#m-cont').textContent=(idx+1)+' de '+slides.length;}
 async function conectar(user,pass){
  const base='https://www.gstatic.com/firebasejs/10.12.2/';
  const [A,AU,F]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]);
  const app=A.initializeApp(FIREBASE_CONFIG),auth=AU.getAuth(app),db=F.getFirestore(app);
  await AU.signInWithEmailAndPassword(auth,user+'@'+DOM,pass);
  fb={F,db,ref:F.doc(db,'control',DOC)};
 }
 function escuchar(){fb.F.onSnapshot(fb.ref,s=>{if(!s.exists())return;const d=s.data();
   if(typeof d.slide==='number'&&d.slide!==idx)window.deckGo(d.slide);
   if(d.pointer){puntero.classList.add('on');puntero.style.left=(d.px*100)+'%';puntero.style.top=(d.py*100)+'%';}
   else puntero.classList.remove('on');});}
 function enviar(o){if(!fb)return;const ahora=Date.now();if(o.px!=null&&ahora-ultima<110)return;ultima=ahora;
   fb.F.setDoc(fb.ref,Object.assign({ts:ahora},o),{merge:true}).catch(()=>{});}
 function abrirPanel(){
  const d=document.createElement('div');d.className='panel';
  d.innerHTML=`<div class="pcaja"><h3>Control remoto</h3><p>Entra con el mismo usuario en el computador y en el celular. El celular manda, el computador obedece.</p>
   <label>Usuario</label><input id="c-user" autocapitalize="none" value="admin">
   <label>Contraseña</label><input id="c-pass" type="password">
   <p class="err" id="c-err"></p>
   <button class="btn" id="c-pantalla">Este equipo es la pantalla</button>
   <button class="btn sec" id="c-mando">Este equipo es mi control</button>
   <button class="cerrar" id="c-cerrar">Cancelar</button></div>`;
  document.body.appendChild(d);
  const cerrar=()=>d.remove();
  d.querySelector('#c-cerrar').onclick=cerrar;
  const entrar=async modo=>{
   const u=d.querySelector('#c-user').value.trim().toLowerCase(),p=d.querySelector('#c-pass').value;
   const err=d.querySelector('#c-err');err.textContent='Conectando…';
   if(!FIREBASE_CONFIG.apiKey){err.textContent='Falta pegar los datos de Firebase en este archivo.';return;}
   try{await conectar(u,p);}catch(e){err.textContent=(e&&e.code==='auth/invalid-credential')?'Usuario o contraseña incorrectos.':'No se pudo conectar ('+((e&&e.code)||'error')+').';return;}
   rol=modo;cerrar();$('#abrir').style.display='none';
   if(modo==='pantalla'){escuchar();}
   else{$('#mando').classList.add('on');pinta();enviar({slide:idx,pointer:false});}
  };
  d.querySelector('#c-pantalla').onclick=()=>entrar('pantalla');
  d.querySelector('#c-mando').onclick=()=>entrar('control');
 }
 $('#abrir').onclick=abrirPanel;
 $('#m-sig').onclick=()=>{idx=Math.min(slides.length-1,idx+1);pinta();enviar({slide:idx});};
 $('#m-atras').onclick=()=>{idx=Math.max(0,idx-1);pinta();enviar({slide:idx});};
 $('#m-salir').onclick=()=>{$('#mando').classList.remove('on');$('#abrir').style.display='';rol=null;enviar({pointer:false});};
 const pad=$('#pad');
 const mover=e=>{const t=e.touches?e.touches[0]:e,r=pad.getBoundingClientRect();
  const px=Math.min(1,Math.max(0,(t.clientX-r.left)/r.width)),py=Math.min(1,Math.max(0,(t.clientY-r.top)/r.height));
  enviar({px,py,pointer:true});};
 pad.addEventListener('touchstart',e=>{e.preventDefault();pad.classList.add('activo');mover(e);},{passive:false});
 pad.addEventListener('touchmove',e=>{e.preventDefault();mover(e);},{passive:false});
 pad.addEventListener('touchend',()=>{pad.classList.remove('activo');enviar({pointer:false});});
 pad.addEventListener('mousedown',e=>{pad.classList.add('activo');mover(e);
  const mv=ev=>mover(ev),up=()=>{pad.classList.remove('activo');enviar({pointer:false});document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);};
  document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);});
})();

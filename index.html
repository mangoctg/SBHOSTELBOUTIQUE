<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#0E8C88">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SB Recepción">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>San Buenaventura Hostel Boutique: sistema de recepción</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F7F8;--panel:#FFFFFF;--ink:#1C2B30;--muted:#62757B;--line:#DCE6E8;--soft:#EDF4F5;
  --accent:#0E8C88;--accent-ink:#FFFFFF;--accent-soft:#DDF2F0;
  --ok:#1F9D5B;--warn:#D97706;--danger:#D93636;--dot:#E5383B;
  --s-conf:#2F6FE0;--s-in:#1F9D5B;--s-out:#9AA5A9;--s-canc:#D64545;--s-ns:#8E5BD6;
  --r-clean:#1F9D5B;--r-dirty:#E8702A;--r-block:#8A949A;
  color-scheme:light;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
#root{height:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1{font-size:20px;margin:0;font-weight:800;letter-spacing:-.01em}
h2{font-size:15px;margin:0 0 10px;font-weight:700}
p{margin:0 0 8px}
small,.muted{color:var(--muted)}

.app{display:grid;grid-template-columns:228px minmax(0,1fr);height:100%}
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px;overflow:auto}
.brand{padding:4px 12px 18px;color:var(--accent);font-weight:800;font-size:22px;letter-spacing:-.02em;line-height:1.1}
.brand span{display:block;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:4px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;padding:9px 12px;border-radius:8px;cursor:pointer;text-align:left;color:#3D5157}
.nav button:hover{background:var(--soft)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.nav kbd{font:600 11px Manrope,sans-serif;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.nav .sep{height:1px;background:var(--line);margin:10px 8px}
.side .hotel{margin-top:auto;padding:14px 12px 0;font-size:12px;color:var(--muted)}
.main{display:flex;flex-direction:column;min-width:0;height:100%;overflow:hidden}
.top{display:flex;align-items:center;gap:10px;padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.bizdate{display:flex;flex-direction:column;line-height:1.2}
.bizdate small{font-size:11px}
.bizdate b{font-weight:700}
.top .who{font-size:13px;color:var(--muted)}
.grow{flex:1}
.content{flex:1;overflow:auto;padding:20px}
.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}

.btn{background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:var(--panel);color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--soft);filter:none}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.sm{padding:5px 10px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
label.check{flex-direction:row;align-items:flex-start;gap:8px;font-weight:500;color:var(--ink);font-size:13px}
input,select,textarea{background:#FAFCFC;border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);font-size:14px;width:100%;min-width:0}
input[type=checkbox]{width:auto;margin-top:3px}
textarea{resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.span2{grid-column:span 2}.span3{grid-column:1/-1}
.form-err{color:var(--danger);font-weight:600;font-size:13px;min-height:1em;margin:10px 0 0}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi b{display:block;font-size:24px;font-weight:800;letter-spacing:-.02em}
.kpi small{font-size:12px}
.scroll{overflow-x:auto;max-width:100%}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--soft)}
.tbl .num{text-align:right;white-space:nowrap}
.empty{color:var(--muted);padding:14px 4px;font-size:13px}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;color:#fff;white-space:nowrap;vertical-align:middle}
.s-confirmada{background:var(--s-conf)}.s-hospedado{background:var(--s-in)}.s-salida{background:var(--s-out)}.s-cancelada{background:var(--s-canc)}.s-noshow{background:var(--s-ns)}
.r-limpia{background:var(--r-clean)}.r-sucia{background:var(--r-dirty)}.r-bloqueada{background:var(--r-block)}
.b-warn{background:#FEF3C7;color:#92400E}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
.reddot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--dot);vertical-align:middle;margin-left:6px}
.warnflag{display:inline-block;font-size:11px;font-weight:700;color:#92400E;background:#FEF3C7;border:1px dashed var(--warn);border-radius:6px;padding:1px 6px;margin-left:6px;white-space:nowrap}
.list-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:0}
.list-row .who{flex:1;min-width:0}
.list-row .who b{display:block}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:-6px 0 12px;align-items:center}

.rack-wrap{overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;max-height:calc(100% - 100px)}
.rack{border-collapse:separate;border-spacing:0;min-width:100%}
.rack th,.rack td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);height:48px;padding:0}
.rack thead th{min-width:74px;font-size:11px;color:var(--muted);font-weight:600;padding:6px 4px;text-align:center;background:var(--panel);position:sticky;top:0;z-index:3}
.rack thead th b{display:block;font-size:15px;color:var(--ink)}
.rack .rk{position:sticky;left:0;background:var(--panel);z-index:2;text-align:left;padding:0 12px;min-width:118px;font-weight:700;white-space:nowrap}
.rack thead .rk{z-index:4}
.rack .rk small{display:block;font-weight:500;font-size:11px}
.rack td.free{cursor:cell}
.rack td.free:hover{background:var(--soft)}
.rack td.blocked{background:repeating-linear-gradient(135deg,transparent 0 6px,rgba(138,148,154,.18) 6px 8px)}
.rack .today{background:rgba(14,140,136,.07)}
.rack thead th.today{color:var(--accent)}
.rack thead th.today b{color:var(--accent)}
.bar{position:relative;display:block;width:calc(100% - 6px);margin:0 3px;height:38px;border:0;border-radius:7px;color:#fff;font-weight:700;font-size:12px;text-align:left;padding:0 18px 0 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;line-height:1.15}
.bar small{display:block;color:rgba(255,255,255,.9);font-weight:500;font-size:10.5px;overflow:hidden;text-overflow:ellipsis}
.bar.s-confirmada{background:var(--s-conf)}.bar.s-hospedado{background:var(--s-in)}.bar.s-salida{background:var(--s-out)}
.bar.noreg{outline:2px dashed var(--warn);outline-offset:-2px;background-image:repeating-linear-gradient(135deg,transparent 0 8px,rgba(255,255,255,.14) 8px 12px)}
.bar .due{position:absolute;top:5px;right:6px;width:10px;height:10px;border-radius:50%;background:var(--dot);box-shadow:0 0 0 2px #fff}

.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.room{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;border-top:5px solid var(--r-clean)}
.room.sucia{border-top-color:var(--r-dirty)}.room.bloqueada{border-top-color:var(--r-block)}
.room .n{font-size:24px;font-weight:800}
.room .btns{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.pos{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(280px,1fr);gap:16px}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.prod{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:left;cursor:pointer}
.prod:hover{border-color:var(--accent)}
.prod b{display:block;margin-bottom:4px}

.chk{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.chk:last-child{border-bottom:0}
.chk .ic{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;font-size:13px}
.chk .ic.ok{background:var(--ok)}.chk .ic.bad{background:var(--danger)}.chk .ic.info{background:var(--warn)}
.chk .body{flex:1;min-width:0}
.chk .body>b{display:block;margin-bottom:4px}

.backdrop{position:fixed;inset:0;background:rgba(28,43,48,.35);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:var(--panel);border-radius:14px;width:100%;max-width:680px;max-height:92%;overflow:auto;padding:20px;box-shadow:0 20px 50px rgba(28,43,48,.2)}
.modal.wide{max-width:860px}
.modal-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:14px}
.modal-head h1{flex:1}
.x{background:none;border:0;font-size:24px;line-height:1;cursor:pointer;color:var(--muted);padding:2px 6px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px 16px;margin-bottom:14px}
.facts div small{display:block;font-size:11px}
.balance{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--soft);border-radius:10px;padding:10px 14px;margin:10px 0;font-weight:700}
.balance b{font-size:18px;white-space:nowrap}
.note{background:#FFF7E6;border-left:4px solid var(--warn);padding:8px 12px;border-radius:6px;font-size:13px;margin-bottom:12px}
.note.red{background:#FDECEC;border-left-color:var(--danger)}
.toast{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;padding:11px 16px;border-radius:10px;font-weight:600;z-index:60;max-width:min(440px,calc(100% - 32px));box-shadow:0 8px 24px rgba(0,0,0,.18)}
.toast.err{background:var(--danger)}

.login{min-height:100%;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,#E4F4F2,#F3F7F8 60%)}
.login-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px;width:100%;max-width:400px;box-shadow:0 12px 40px rgba(14,140,136,.08)}
.login .brand{padding:0 0 18px;font-size:30px}
.tabs{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:10px;margin-bottom:16px}
.tabs button{flex:1;border:0;background:none;padding:8px;border-radius:7px;cursor:pointer;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--panel);color:var(--ink)}
.stack{display:flex;flex-direction:column;gap:12px}
.hint{font-size:12px;color:var(--muted);background:var(--soft);border-radius:8px;padding:10px 12px;margin-top:16px}
.case{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.case:last-child{border-bottom:0}
.case b{display:block;margin-bottom:2px}
.case.done b{text-decoration:line-through;color:var(--muted)}
.bars .row{display:grid;grid-template-columns:86px 1fr 44px;gap:10px;align-items:center;font-size:12px;margin-bottom:6px}
.bars .track{background:var(--soft);border-radius:4px;height:14px;overflow:hidden}
.bars .fill{background:var(--accent);height:100%}
kbd.k{font:700 12px Manrope,sans-serif;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 7px;background:var(--bg)}

@media (max-width:860px){
  .app{grid-template-columns:1fr;grid-template-rows:auto auto minmax(0,1fr)}
  .main{display:contents}
  .side{flex-direction:row;align-items:center;padding:6px 8px;overflow-x:auto;gap:6px;border-right:0;border-bottom:1px solid var(--line);order:2}
  .top{order:1;padding:8px 12px;gap:6px}
  .content{order:3;padding:12px;min-height:0}
  .brand,.side .hotel,.nav kbd,.nav .sep{display:none}
  .nav{flex-direction:row;gap:2px}
  .nav button{white-space:nowrap;padding:7px 10px;font-size:13px}
  .top .who,.hide-m{display:none}
  .grid2,.grid3{grid-template-columns:1fr}
  .span2{grid-column:auto}
  .pos{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .kpi b{font-size:20px}
  h1{font-size:18px}
  .rack thead th{min-width:60px}
  .rack .rk{min-width:76px;padding:0 8px}
  .rack-wrap{max-height:none}
  .backdrop{padding:0;align-items:flex-end}
  .modal,.modal.wide{max-height:94%;border-radius:14px 14px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
  .actions .btn{flex:1 1 auto}
}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .18s ease-out}@keyframes pop{from{transform:translateY(8px);opacity:0}}}
@media print{.side,.top,.toolbar,.actions,.x{display:none!important}.backdrop{position:static;background:none}.modal{box-shadow:none;max-height:none}}

.modal .tabs{margin-bottom:14px}
label.case{flex-direction:row;align-items:flex-start;font-size:14px;font-weight:400;color:var(--ink);cursor:pointer}
label.case>span{display:block;min-width:0}
label.case>span>span{display:block}
.case .think{display:block;margin-top:6px;font-style:italic;color:#0B6E6A}
.case .guide{display:block;margin-top:6px;font-size:12px;background:#FFF7E6;border-left:3px solid var(--warn);padding:6px 10px;border-radius:6px;color:#7A4A0A}
.login .brand{color:var(--accent)}

.modes{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:10px;margin-bottom:6px;max-width:520px}
.modes button{flex:1;border:0;background:none;padding:8px 6px;border-radius:7px;cursor:pointer;font-weight:700;color:var(--muted);white-space:nowrap;font-size:13px}
.modes button[aria-selected="true"]{background:var(--panel);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.mode-help{font-size:12px;color:var(--muted);margin:0 0 14px}
.chk .ic.pend{background:var(--line);color:var(--muted)}
.inline-form{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.inline-form input,.inline-form select{max-width:280px}
.answer{background:var(--soft);border-radius:8px;padding:8px 10px;margin-top:6px;white-space:pre-wrap;font-size:13px}
</style>
</head>

<div id="root"></div>
<div id="modal-root"></div>
<script>
(function(){
'use strict';
/* =====================================================================
   CONFIGURACIÓN DE FIREBASE
   Pega aquí los datos de tu proyecto (Consola de Firebase > Configuración
   del proyecto > Tus apps > Configuración del SDK). Mientras apiKey esté
   vacío, el sistema funciona en MODO DEMOSTRACIÓN (solo en este navegador).
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "",
  authDomain: "",
  projectId: "",
  storageBucket: "",
  messagingSenderId: "",
  appId: ""
};
const ADMIN_USER='admin', DOMAIN='sbhb.app';
const HOTEL_NAME='San Buenaventura Hostel Boutique';

/* ---------- Utilidades ---------- */
function sha256(ascii){function r(v,a){return(v>>>a)|(v<<(32-a))}var mp=Math.pow,mw=mp(2,32),i,j,res='',words=[],abl=ascii.length*8,hash=[],k=[],pc=0,ic={};for(var c=2;pc<64;c++){if(!ic[c]){for(i=0;i<313;i+=c)ic[i]=c;hash[pc]=(mp(c,.5)*mw)|0;k[pc++]=(mp(c,1/3)*mw)|0}}hash=hash.slice(0,8);ascii+='\x80';while(ascii.length%64-56)ascii+='\x00';for(i=0;i<ascii.length;i++){j=ascii.charCodeAt(i);if(j>>8)return '';words[i>>2]|=j<<((3-i)%4)*8}words[words.length]=((abl/mw)|0);words[words.length]=(abl);for(j=0;j<words.length;){var w=words.slice(j,j+=16),oh=hash;hash=hash.slice(0,8);for(i=0;i<64;i++){var w15=w[i-15],w2=w[i-2],a=hash[0],e=hash[4],t1=hash[7]+(r(e,6)^r(e,11)^r(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(r(w15,7)^r(w15,18)^(w15>>>3))+w[i-7]+(r(w2,17)^r(w2,19)^(w2>>>10)))|0),t2=(r(a,2)^r(a,13)^r(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));hash=[(t1+t2)|0].concat(hash);hash[4]=(hash[4]+t1)|0}for(i=0;i<8;i++)hash[i]=(hash[i]+oh[i])|0}for(i=0;i<8;i++){for(j=3;j+1;j--){var b=(hash[i]>>(j*8))&255;res+=((b<16)?0:'')+b.toString(16)}}return res}
const H=(user,pass)=>sha256(unescape(encodeURIComponent('muelle|'+user+'|'+pass)));
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
const toUTC=s=>{const p=s.split('-').map(Number);return Date.UTC(p[0],p[1]-1,p[2]);};
const addDays=(s,n)=>{const t=new Date(toUTC(s)+n*864e5);return t.getUTCFullYear()+'-'+pad(t.getUTCMonth()+1)+'-'+pad(t.getUTCDate());};
const diff=(a,b)=>Math.round((toUTC(b)-toUTC(a))/864e5);
const fmtD=s=>{if(!s)return '';const p=s.split('-');return p[2]+'/'+p[1]+'/'+p[0];};
const DOW=['dom','lun','mar','mié','jue','vie','sáb'];
const MON=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const dow=s=>DOW[new Date(toUTC(s)).getUTCDay()];
const longD=s=>{const d=new Date(toUTC(s));return ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'][d.getUTCDay()]+' '+d.getUTCDate()+' de '+['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'][d.getUTCMonth()];};
const money=n=>(n<0?'−':'')+new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(Math.abs(Math.round(n||0)));
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-3);
const hhmm=ts=>{const d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes());};
const ri=n=>Math.floor(Math.random()*n);

function demoBackend(){
  const K='sbhb-demo-v1';let st=null;
  try{st=JSON.parse(localStorage.getItem(K)||'null');}catch(e){}
  if(!st||!st.data){st={accounts:[{uid:'u-admin',user:ADMIN_USER,ph:'e940634756994bd7b72edc3b511180d8220214e43b3d161ef0a8c1867d648ebc'}],session:null,data:{config:null}};COLS.forEach(c=>st.data[c]={});st.data.users['u-admin']={id:'u-admin',name:'Profesor',user:ADMIN_USER,role:'admin',active:true,practice:[],created:Date.now()};}
  let onData,onAuth,gcb=null;
  const emitG=()=>{if(!gcb)return;const all=st.data.grades||{};gcb.cb(gcb.adm?clone(all):(all[st.session]?{[st.session]:clone(all[st.session])}:{}));};
  const persist=()=>{try{localStorage.setItem(K,JSON.stringify(st));}catch(e){}};
  const emit=()=>{const d=clone(st.data),o={config:d.config};COLS.forEach(c=>o[c]=Object.values(d[c]));onData(o);};
  const commit=()=>{persist();setTimeout(emit,0);};
  const ok=()=>{if(!st.session)throw{code:'permission-denied'};};
  return {mode:'demo',
    init(od,oa){onData=od;onAuth=oa;emit();oa(st.session);},
    async signIn(user,pass){const a=st.accounts.find(x=>x.user===user&&x.ph===H(user,pass));if(!a)throw{code:'auth/invalid-credential'};st.session=a.uid;persist();onAuth(a.uid);},
    async signUp(name,user,pass){if(st.accounts.some(x=>x.user===user))throw{code:'auth/email-already-in-use'};const id='u'+uid();st.accounts.push({uid:id,user,ph:H(user,pass)});st.data.users[id]={id,name,user,role:user===ADMIN_USER?'admin':'recepcion',active:true,practice:[],created:Date.now()};st.session=id;persist();emit();onAuth(id);},
    async signOut(){st.session=null;persist();onAuth(null);},
    async changePass(o,n){const a=st.accounts.find(x=>x.uid===st.session);if(!a||a.ph!==H(a.user,o))throw{code:'auth/wrong-password'};a.ph=H(a.user,n);persist();},
    async put(col,obj){ok();if(col==='config')st.data.config=clone(obj);else st.data[col][obj.id]=clone(obj);
      if(col==='log'){const ks=Object.keys(st.data.log);if(ks.length>300){ks.sort((a,b)=>st.data.log[a].ts-st.data.log[b].ts).slice(0,ks.length-300).forEach(k=>delete st.data.log[k]);}}commit();},
    async patch(col,id,f){ok();const t=col==='config'?st.data.config:st.data[col][id];if(!t)throw{code:'not-found'};Object.assign(t,clone(f));commit();},
    async push(col,id,field,items){ok();const t=st.data[col][id];if(!t)throw{code:'not-found'};t[field]=t[field]||[];items.forEach(it=>{const s=JSON.stringify(it);if(!t[field].some(x=>JSON.stringify(x)===s))t[field].push(clone(it));});commit();},
    async del(col,id){ok();delete st.data[col][id];commit();},
    async loadPrivate(kind){return localStorage.getItem('sbhb-demo-'+kind+'-'+st.session);},
    async savePrivate(kind,json){try{localStorage.setItem('sbhb-demo-'+kind+'-'+st.session,json);}catch(e){}},
    watchGrades(adm,cb){gcb={adm,cb};emitG();return ()=>{gcb=null;};},
    async saveGrade(id,p){ok();st.data.grades=st.data.grades||{};const g=st.data.grades[id]||(st.data.grades[id]={});deepMerge(g,clone(p));persist();setTimeout(emitG,0);},
    async reset(sd){ok();['rooms','guests','res','sales','closures','audits','log'].forEach(c=>st.data[c]={});['rooms','guests','res'].forEach(c=>sd[c].forEach(o=>st.data[c][o.id]=clone(o)));st.data.config=clone(sd.config);commit();}
  };
}

async function firebaseBackend(){
  const base='https://www.gstatic.com/firebasejs/10.12.2/';
  const [A,AU,F]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]);
  const app=A.initializeApp(FIREBASE_CONFIG),auth=AU.getAuth(app),db=F.getFirestore(app);
  const mail=u=>u+'@'+DOMAIN;
  let onData,unsubs=[],data={};
  const emit=()=>{if(data.config===undefined||COLS.some(c=>!data[c]))return;onData(Object.assign({},data));};
  const fail=e=>{console.error(e);if(e&&e.code==='permission-denied')toast('No tienes permiso para ver los datos. Revisa las reglas de Firestore.',true);};
  const stop=()=>{unsubs.forEach(u=>u());unsubs=[];data={config:undefined};};
  const start=()=>{stop();
    unsubs.push(F.onSnapshot(F.doc(db,'config','main'),s=>{data.config=s.exists()?s.data():null;emit();},fail));
    COLS.forEach(c=>{const q=c==='log'?F.query(F.collection(db,'log'),F.orderBy('ts','desc'),F.limit(60)):F.collection(db,c);
      unsubs.push(F.onSnapshot(q,s=>{data[c]=s.docs.map(d=>Object.assign({},d.data(),{id:d.id}));emit();},fail));});};
  const ref=(col,id)=>F.doc(db,col,col==='config'?'main':id);
  return {mode:'firebase',
    init(od,oa){onData=od;AU.onAuthStateChanged(auth,u=>{if(u)start();else stop();oa(u?u.uid:null);});},
    signIn:(user,pass)=>AU.signInWithEmailAndPassword(auth,mail(user),pass),
    async signUp(name,user,pass){const c=await AU.createUserWithEmailAndPassword(auth,mail(user),pass);await F.setDoc(F.doc(db,'users',c.user.uid),{id:c.user.uid,name,user,role:user===ADMIN_USER?'admin':'recepcion',active:true,practice:[],created:Date.now()});},
    signOut:()=>AU.signOut(auth),
    async changePass(o,n){const u=auth.currentUser;await AU.reauthenticateWithCredential(u,AU.EmailAuthProvider.credential(u.email,o));await AU.updatePassword(u,n);},
    put:(col,o)=>F.setDoc(ref(col,o.id),clone(o)),
    patch:(col,id,f)=>F.updateDoc(ref(col,id),clone(f)),
    push:(col,id,field,items)=>F.updateDoc(ref(col,id),{[field]:F.arrayUnion.apply(null,clone(items))}),
    del:(col,id)=>F.deleteDoc(ref(col,id)),
    async loadPrivate(kind){const s=await F.getDoc(F.doc(db,kind,auth.currentUser.uid));return s.exists()?s.data().json:null;},
    savePrivate:(kind,json)=>F.setDoc(F.doc(db,kind,auth.currentUser.uid),{json,updated:Date.now()}),
    watchGrades(adm,cb){const u=adm?F.onSnapshot(F.collection(db,'grades'),s=>{const m={};s.forEach(d=>m[d.id]=d.data());cb(m);},fail):F.onSnapshot(F.doc(db,'grades',auth.currentUser.uid),s=>cb(s.exists()?{[s.id]:s.data()}:{}),fail);unsubs.push(u);return u;},
    saveGrade:(id,p)=>F.setDoc(F.doc(db,'grades',id),clone(p),{merge:true}),
    async reset(sd){const ops=[];
      ['rooms','guests','res','sales','closures','audits'].forEach(c=>(S[c]||[]).forEach(o=>ops.push(['d',c,o.id])));
      const ls=await F.getDocs(F.collection(db,'log'));ls.forEach(d=>ops.push(['d','log',d.id]));
      ['rooms','guests','res'].forEach(c=>sd[c].forEach(o=>ops.push(['s',c,o])));ops.push(['s','config',sd.config]);
      for(let i=0;i<ops.length;i+=400){const b=F.writeBatch(db);ops.slice(i,i+400).forEach(([t,c,o])=>{if(t==='d')b.delete(ref(c,o));else b.set(ref(c,o.id),clone(o));});await b.commit();}}
  };
}

function flushPV(){if(pvTimer){clearTimeout(pvTimer);pvTimer=null;if(pvKind)savePV(pvKind,S);}}
async function setMode(m){
  if(m===MODE)return;flushPV();closeModal();
  if(m==='shared'){MODE='shared';pvKind=null;S=SH;view='hoy';rackStart=null;cart=[];render();return;}
  {const c=$('#content');if(c)c.innerHTML='<p class="muted">Abriendo tu hotel…</p>';}
  let raw=null;try{raw=await B.loadPrivate(m);}catch(e){toast(errMsg(e),true);return;}

  if(!pv||!pv.config)pv=newPrivate(seed());

}
const putDoc=(col,o)=>W(D.put(col,o));
const patchRes=(r,f)=>{Object.assign(r,f);return W(D.patch('res',r.id,f));};
const addFolio=(r,es)=>{r.folio=r.folio||[];es.forEach(e=>{if(!r.folio.some(x=>x.id===e.id))r.folio.push(e);});return W(D.push('res',r.id,'folio',es));};
const addPosted=(r,ds)=>{r.posted=r.posted||[];ds.forEach(d=>{if(!r.posted.includes(d))r.posted.push(d);});return W(D.push('res',r.id,'posted',ds));};

/* ---------- Reglas del hotel ---------- */
const biz=()=>S.config.biz;
const room=id=>S.rooms.find(r=>r.id===id)||{id,num:'?',type:'EST',status:'limpia'};
const rtype=code=>(S.config.types||[]).find(t=>t.code===code)||{name:'?',rate:0,cap:2};
const guest=id=>S.guests.find(g=>g.id===id)||{nombre:'?',apellido:''};
const gname=g=>(g.nombre+' '+g.apellido).trim();
const resById=id=>S.res.find(r=>r.id===id);
const nights=r=>diff(r.in,r.out);
const occupying=r=>r.status!=='cancelada'&&r.status!=='noshow';
const folio=r=>r.folio||[];
const posted=r=>r.posted||[];
const sumF=(r,t)=>folio(r).filter(f=>f.type===t).reduce((a,f)=>a+f.amount,0);
const stayDates=r=>{const a=[];for(let d=r.in;d<r.out;d=addDays(d,1))a.push(d);return a;};
const unpostedAll=r=>stayDates(r).filter(d=>!posted(r).includes(d)).length;
const stayLimit=r=>{let lim=r.out<biz()?r.out:biz();if(lim<=r.in)lim=addDays(r.in,1);return lim;};
const unpostedStayed=r=>stayDates(r).filter(d=>d<stayLimit(r)&&!posted(r).includes(d)).length;
const est=r=>{if(!occupying(r))return 0;if(r.status==='salida')return sumF(r,'cargo')-sumF(r,'pago');return sumF(r,'cargo')+unpostedAll(r)*r.rate-sumF(r,'pago');};
const due=r=>r.status==='hospedado'?sumF(r,'cargo')+unpostedStayed(r)*r.rate-sumF(r,'pago'):est(r);
const regOk=g=>!!(g.docNum&&g.nombre&&g.apellido&&g.nac&&g.birth&&g.city&&g.phone&&g.dataOk);
const noReg=r=>(r.status==='hospedado'||r.status==='salida')&&!regOk(guest(r.guestId));
const rateOff=r=>(r.status==='hospedado'||r.status==='confirmada')&&!r.rateOk&&r.rate<rtype(room(r.roomId).type).rate*0.6;
const available=(roomId,a,b,except)=>!S.res.some(r=>r.id!==except&&r.roomId===roomId&&occupying(r)&&r.in<b&&a<r.out);
const newCode=()=>{let c;do{c='R'+(1000+ri(9000));}while(S.res.some(r=>r.code===c));return c;};

  if(!rackStart)rackStart=addDays(biz(),-2);

  $('#root').innerHTML=`<div class="app">

      <span class="who">${esc(u.name)}, ${ROLES[u.role]||u.role}</span>
      <button class="btn ghost sm hide-m" data-act="help">Atajos</button>
      <button class="btn ghost sm" data-act="pwd">Contraseña</button>
      <button class="btn ghost sm" data-act="logout">Salir</button>

      <main class="content" id="content"><div class="modes" role="tablist">${MODES.map(([k,l])=>`<button role="tab" data-act="mode" data-m="${k}" aria-selected="${MODE===k}">${l}</button>`).join('')}</div><p class="mode-help">${MODE_HELP[MODE]}</p>${VIEWS[view]?VIEWS[view]():VIEWS.hoy()}</main></div></div>`;

const VIEWS={
hoy(){
  const T=biz();
  const arr=S.res.filter(r=>r.status==='confirmada'&&r.in<=T);
  const dep=S.res.filter(r=>r.status==='hospedado'&&r.out<=T);

  <div class="kpis"><div class="kpi"><b>${arr.length}</b><small>Llegadas pendientes</small></div><div class="kpi"><b>${dep.length}</b><small>Salidas pendientes</small></div><div class="kpi"><b>${inh.length}</b><small>Habitaciones en casa</small></div><div class="kpi"><b>${Math.round(tonight/Math.max(1,S.rooms.length)*100)}%</b><small>Ocupación esta noche</small></div><div class="kpi"><b>${dirty}</b><small>Por limpiar</small></div></div>

   <section class="panel"><h2>Llegadas pendientes</h2>${arr.map(r=>rowR(r,`<button class="btn sm" data-act="ci" data-id="${r.id}">Check-in</button>`)).join('')||'<p class="empty">No quedan llegadas pendientes.</p>'}</section>
   <section class="panel"><h2>Salidas pendientes</h2>${dep.map(r=>rowR(r,`<button class="btn sm" data-act="co" data-id="${r.id}">Check-out</button>`)).join('')||'<p class="empty">No quedan salidas pendientes.</p>'}</section>
   <section class="panel"><h2>En casa</h2>${inh.map(r=>rowR(r)).join('')||'<p class="empty">No hay huéspedes hospedados.</p>'}</section>
   <section class="panel"><h2>Actividad del equipo</h2>${S.log.slice(0,10).map(l=>`<div class="list-row"><div class="who"><b style="font-weight:600">${esc(l.msg)}</b><small>${esc(l.u)}, ${new Date(l.ts).toLocaleString('es-CO',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</small></div></div>`).join('')||'<p class="empty">Sin actividad todavía.</p>'}</section>
  </div>`;
},
rack(){
  const T=biz(),days=[...Array(14)].map((_,i)=>addDays(rackStart,i)),end=addDays(rackStart,14);
  let h=`<div class="toolbar"><h1>Rack</h1><span class="grow"></span><button class="btn ghost sm" data-act="rack" data-d="-7">‹ Semana</button><button class="btn ghost sm" data-act="rack" data-d="0">Hoy</button><button class="btn ghost sm" data-act="rack" data-d="7">Semana ›</button><button class="btn ghost sm" data-act="ota">Simular reserva de OTA</button></div>
  <div class="legend"><span><i class="dot s-confirmada"></i>Pendiente de check-in</span><span><i class="dot s-hospedado"></i>En casa</span><span><i class="dot s-salida"></i>Check-out</span><span><i class="dot" style="background:var(--dot)"></i>Saldo pendiente</span><span class="warnflag" style="margin:0">Sin registro</span><span><i class="dot r-sucia"></i>Hab. sucia</span></div>
  <div class="rack-wrap"><table class="rack"><thead><tr><th class="rk">Hab.</th>${days.map(d=>`<th class="${d===T?'today':''}">${dow(d)}<b>${+d.slice(8)}</b>${d.slice(8)==='01'||d===rackStart?MON[+d.slice(5,7)-1]:''}</th>`).join('')}</tr></thead><tbody>`;
  S.rooms.slice().sort((a,b)=>a.num.localeCompare(b.num)).forEach(rm=>{
    h+=`<tr><th class="rk"><i class="dot r-${rm.status}" title="${RST[rm.status]}"></i>${rm.num}<small>${esc(rtype(rm.type).name)}</small></th>`;
    const list=S.res.filter(r=>r.roomId===rm.id&&occupying(r)&&r.in<end&&r.out>rackStart);
    let i=0;
    while(i<14){const d=days[i];const r=list.find(x=>x.in<=d&&x.out>d);
      if(r){const last=r.out<end?r.out:end;const span=Math.max(1,diff(d,last));const g=guest(r.guestId);const nr=noReg(r);
        h+=`<td colspan="${span}"><button class="bar s-${r.status}${nr?' noreg':''}" data-act="open-res" data-id="${r.id}" title="${esc(gname(g))}, ${fmtD(r.in)} a ${fmtD(r.out)}">${est(r)>0?'<i class="due" aria-label="Saldo pendiente"></i>':''}${esc(gname(g))}<small>${nr?'Sin registro, ':''}${rateOff(r)?'Revisar tarifa, ':''}${esc(r.source)}</small></button></td>`;i+=span;}
      else{const blocked=rm.status==='bloqueada';h+=`<td class="${blocked?'blocked':'free'} ${d===T?'today':''}" ${blocked||d<T?'':`data-act="new-res" data-room="${rm.id}" data-date="${d}"`}></td>`;i++;}
    }
    h+='</tr>';
  });
  return h+'</tbody></table></div>';
},

auditoria(){

   ${item(!c.dep.length,'bad','Salidas sin resolver',`Los huéspedes que debían salir hasta hoy necesitan check-out o extender la estadía. ${c.dep.length?plural(c.dep.length,'pendiente')+'.':''}`,c.dep.map(r=>rowR(r,`<button class="btn sm" data-act="co" data-id="${r.id}">Check-out</button><button class="btn ghost sm" data-act="extend" data-id="${r.id}">Extender</button>`)).join(''))}
   ${item(!c.noreg.length,'bad','Tarjetas de registro incompletas','Todo huésped en casa debe tener su registro completo (documento, nacionalidad, procedencia y autorización de datos).',c.noreg.map(r=>rowR(r,`<button class="btn sm" data-act="reg" data-id="${r.id}">Completar registro</button>`)).join(''))}
   ${item(!c.rates.length,'bad','Tarifas fuera de rango','Tarifas por debajo del 60% de la tarifa del tipo de habitación. Corrígela o apruébala con una justificación.',c.rates.map(r=>rowR(r,`<button class="btn sm" data-act="rate" data-id="${r.id}">Revisar tarifa</button>`)).join(''))}
   ${item(!c.bal.length,'info','Folios en casa con saldo pendiente','No bloquea el cierre, pero debes reportarlos al gerente o al turno de la mañana.',c.bal.map(r=>rowR(r)).join(''))}
   ${item(!c.dirty.length,'info','Habitaciones sucias',c.dirty.length?'Habitaciones: '+c.dirty.map(r=>r.num).join(', ')+'. Informa a housekeeping para el día siguiente.':'Todas las habitaciones están limpias o bloqueadas.')}
   ${item(!c.open.length,'info','Cajas sin cerrar',c.open.length?'Recepcionistas con turno abierto: '+c.open.map(esc).join(', ')+'.':'Todas las cajas están cerradas.')}

 {n:1,t:'Introducción: cómo trabajar en el programa',tasks:[

 {n:2,t:'Llegadas',tasks:[

function calc(g){g=g||{};const at=ALLT.filter(t=>t.k!=='write'),wt=ALLT.filter(t=>t.k==='write'),au=g.auto||{},ts=g.teacher||{};

function myMoves(userId){
  const last=S.closures.filter(c=>c.userId===userId).reduce((a,c)=>Math.max(a,c.ts),0);const mv=[];
  S.res.forEach(r=>folio(r).forEach(f=>{if(f.type==='pago'&&f.userId===userId&&f.ts>last)mv.push({d:f.d,ts:f.ts,concept:f.concept,ref:r.code+', hab. '+room(r.roomId).num,method:f.method,amount:f.amount});}));
  S.sales.forEach(s=>{if(s.userId===userId&&s.ts>last)mv.push({d:s.d,ts:s.ts,concept:s.concept,ref:'Venta de contado',method:s.method,amount:s.amount});});

}

   <div><small>Habitación</small><b>${rm.num}, ${esc(rtype(rm.type).name)}</b></div><div><small>Estadía</small><b>${fmtD(r.in)} al ${fmtD(r.out)}</b></div><div><small>Noches y personas</small><b>${plural(nights(r),'noche')}, ${plural(r.adults,'adulto')}${r.children?', '+plural(r.children,'niño'):''}</b></div>
   <div><small>Canal</small><b>${esc(r.source)}</b></div><div><small>Tarifa por noche</small><b>${money(r.rate)}</b></div><div><small>Creada por</small><b>${esc(r.by)}</b></div></div>

   ${r.status==='hospedado'?`<div class="balance"><span>Saldo a la fecha (para check-out hoy)</span><b style="color:${d>0?'var(--danger)':d<0?'var(--warn)':'var(--ok)'}">${money(d)}</b></div>`:''}

    const inE=$('#rf-in'),outE=$('#rf-out'),rmE=$('#rf-room'),rateE=$('#rf-rate'),gE=$('#rf-guest');let sel=pre.room||'';

    const fill=()=>{const a=inE.value,b=outE.value;rmE.innerHTML=S.rooms.slice().sort((x,y)=>x.num.localeCompare(y.num)).map(rm=>{const ok=a&&b&&a<b&&rm.status!=='bloqueada'&&available(rm.id,a,b);return `<option value="${rm.id}" ${ok?'':'disabled'}>${rm.num}, ${esc(rtype(rm.type).name)} (${money(rtype(rm.type).rate)})${ok?'':rm.status==='bloqueada'?', bloqueada':', no disponible'}</option>`;}).join('');
      const o=[...rmE.options];const p=o.find(x=>x.value===sel&&!x.disabled)||o.find(x=>!x.disabled);if(p){rmE.value=p.value;sel=p.value;}else rmE.value='';setRate();};
    inE.onchange=()=>{if(!outE.value||outE.value<=inE.value)outE.value=addDays(inE.value,1);fill();};

function otaSim(silent){
  const T=biz(),used=new Set(S.guests.map(g=>g.nombre+g.apellido));const src=pick(['Booking.com','Expedia','Airbnb']);
  for(let t=0;t<40;t++){const inD=addDays(T,ri(10)),outD=addDays(inD,1+ri(4));
    const list=S.rooms.filter(rm=>rm.status!=='bloqueada'&&available(rm.id,inD,outD));if(!list.length)continue;
    const rm=pick(list),rate=Math.round(rtype(rm.type).rate*(src==='Airbnb'?1:1.1)/1000)*1000;
    const tmp=[];const g=newGuest(tmp,used,false,Math.random()<.5);S.guests.push(g);putDoc('guests',g);
    const r={id:uid(),code:newCode(),guestId:g.id,roomId:rm.id,in:inD,out:outD,adults:Math.min(2,rtype(rm.type).cap),children:0,source:src,status:'confirmada',rate,notes:src==='Booking.com'?'Pago en el hotel. Tarjeta de garantía en el extranet.':'Prepagada por el canal.',created:Date.now(),by:src,folio:[],posted:[],rateOk:false};
    if(src!=='Booking.com')r.folio.push({id:uid(),d:T,ts:Date.now(),type:'pago',concept:'Prepago del canal',amount:rate*diff(inD,outD),method:'Tarjeta virtual OTA',user:src,userId:'ota',kind:''});
    S.res.push(r);putDoc('res',r);log(`Entró la reserva ${r.code} desde ${src} para ${gname(g)}`);
    if(!silent){render();toast(`Nueva reserva de ${src}: ${r.code}, hab. ${rm.num}, llega el ${fmtD(inD)}`);}return r;}
  if(!silent)toast('No hay disponibilidad en los próximos 10 días para simular una reserva.',true);return null;
}
function closeDay(){
  const T=biz(),u=ME();
  if(S.audits.some(a=>a.d===T)){toast('Este día ya fue cerrado por otro auditor.',true);return;}
  const inh=S.res.filter(r=>r.status==='hospedado'&&r.in<=T&&r.out>T);
  let roomRev=0;inh.forEach(r=>{if(!posted(r).includes(T)){addFolio(r,[nightEntry(r,T,room(r.roomId).num)]);addPosted(r,[T]);roomRev+=r.rate;}});
  const avail=S.rooms.filter(r=>r.status!=='bloqueada').length,occ=inh.length;
  let other=0;const pay={};
  S.res.forEach(r=>folio(r).forEach(f=>{if(f.d!==T)return;if(f.type==='cargo'&&f.kind!=='aloj')other+=f.amount;if(f.type==='pago'&&f.userId!=='ota'&&f.userId!=='sys')pay[f.method]=(pay[f.method]||0)+f.amount;}));
  S.sales.forEach(s=>{if(s.d===T){other+=s.amount;pay[s.method]=(pay[s.method]||0)+s.amount;}});
  const cnt=k=>S.res.filter(r=>r[k]===T).length;
  const a={id:'a-'+T,d:T,ts:Date.now(),by:u.name,occ,avail,occPct:avail?Math.round(occ/avail*100):0,roomRev,other,adr:occ?Math.round(roomRev/occ):0,revpar:avail?Math.round(roomRev/avail):0,pay,arr:cnt('ciD'),dep:cnt('coD'),ns:cnt('nsD'),cx:cnt('cxD'),withBal:S.res.filter(r=>r.status==='hospedado'&&due(r)>0).length};
  S.audits.push(a);putDoc('audits',a);patchCfg({biz:addDays(T,1)});rackStart=addDays(biz(),-2);
  let n=0;const k=ri(3);for(let i=0;i<k;i++)if(otaSim(true))n++;
  S.rooms.forEach(rm=>{if(rm.status==='limpia'&&S.res.some(r=>r.roomId===rm.id&&r.status==='hospedado')&&Math.random()<.5){rm.status='sucia';putDoc('rooms',rm);}});
  log(`Cerró el día ${fmtD(T)}. Ocupación ${a.occPct}%, alojamiento ${money(roomRev)}`);render();auditReport(a.id);
  toast(`Día cerrado. Nueva fecha del hotel: ${fmtD(biz())}${n?'. Entraron '+plural(n,'reserva')+' por OTA durante la noche':''}`);
}

 rack(el){const d=+el.dataset.d;rackStart=d===0?addDays(biz(),-2):addDays(rackStart,d);render();},
 ota(){otaSim();},
 'close-day'(){if(!canAudit())return;const T=biz();confirmBox(`Vas a cerrar el día ${fmtD(T)}. Se cargará la noche de alojamiento a cada habitación ocupada y la fecha del hotel pasará al ${fmtD(addDays(T,1))} para todo el equipo. Esta acción no se puede deshacer.`,closeDay,'Cerrar el día');},
 'audit-rep'(el){auditReport(el.dataset.id);},
 'open-guest'(el){const g=guest(el.dataset.id),rs=S.res.filter(r=>r.guestId===g.id);openModal(esc(gname(g)),`<div class="facts"><div><small>Documento</small><b>${g.docNum?esc(g.docType+' '+g.docNum):'Sin registrar'}</b></div><div><small>Nacionalidad</small><b>${esc(g.nac||'')}</b></div><div><small>Nacimiento</small><b>${fmtD(g.birth)}</b></div><div><small>Procedencia</small><b>${esc(g.city||'')}</b></div><div><small>Teléfono</small><b>${esc(g.phone||'')}</b></div><div><small>Correo</small><b>${esc(g.email||'')}</b></div></div><h2>Estancias</h2><div class="scroll"><table class="tbl"><tbody>${rs.map(r=>`<tr class="click" data-act="open-res" data-id="${r.id}"><td>${r.code}</td><td>Hab. ${room(r.roomId).num}</td><td>${fmtD(r.in)} al ${fmtD(r.out)}</td><td>${badge(r.status)}</td></tr>`).join('')}</tbody></table></div>`,{nofocus:true});},
 'cart-add'(el){const p=C().products.find(x=>x.id===el.dataset.id);if(!p)return;const c=cart.find(x=>x.id===p.id);if(c)c.qty++;else cart.push({id:p.id,name:p.name,price:p.price,qty:1});render();},
 'cart-q'(el){const c=cart[+el.dataset.i];c.qty+=+el.dataset.d;if(c.qty<1)cart.splice(+el.dataset.i,1);render();},
 'close-shift'(){const u=ME(),mv=myMoves(u.id),total=mv.reduce((a,m)=>a+m.amount,0);confirmBox(`Vas a cerrar tu turno con ${plural(mv.length,'movimiento')} por ${money(total)}. Verifica que el efectivo en caja coincida antes de confirmar.`,()=>{const c={id:uid(),d:biz(),ts:Date.now(),userId:u.id,name:u.name,total,count:mv.length};S.closures.push(c);putDoc('closures',c);log(`Cerró turno por ${money(total)}`);render();toast('Turno cerrado');},'Cerrar turno');},
 export(el){exportData(el.dataset.what);},
 copy(){const t=$('#tsv');t.focus();t.select();let ok=false;try{ok=document.execCommand('copy');}catch(e){}
  const msg=ok=>toast(ok?'Datos copiados. Pégalos en Excel con Ctrl+V.':'Selecciona el texto y cópialo con Ctrl+C.',!ok);
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t.value).then(()=>msg(true),()=>msg(ok));else msg(ok);},
 case(el){const u=ME(),i=el.dataset.id,arr=(u.practice||[]).filter(x=>typeof x==='string'),k=arr.indexOf(i);if(k>=0)arr.splice(k,1);else arr.push(i);u.practice=arr;W(B.patch('users',u.id,{practice:arr}));render();},
 'user-toggle'(el){const u=S.users.find(x=>x.id===el.dataset.id);const v=u.active===false;u.active=v;W(B.patch('users',u.id,{active:v}));render();toast(v?'Usuario activado':'Usuario desactivado');},
 pwd(){openModal('Cambiar mi contraseña',`<form id="setpass" class="stack"><label>Contraseña actual<input name="old" type="password" required></label><label>Nueva contraseña<input name="pass" type="password" required></label><p class="form-err"></p><div class="actions"><button type="button" class="btn ghost" data-act="close-modal">Cancelar</button><button class="btn">Guardar</button></div></form>`);},
 reset(){if(MODE!=='shared'){confirmBox(MODE==='retos'?'Se generará un hotel nuevo y <b>se borrará todo tu avance en los retos</b>. ¿Seguro?':'Se generará un hotel nuevo para tu zona libre.',()=>{rackStart=null;cart=[];D.reset(seed());lastG='';render();toast('Hotel nuevo generado');},'Generar hotel nuevo',true);return;}
  confirmBox('Se borrarán reservas, huéspedes, pagos, cierres y auditorías de todo el equipo, y se cargará un escenario nuevo con fecha de hoy. Las cuentas se conservan.',()=>{const sd=seed();rackStart=null;cart=[];W(B.reset(sd)).then(()=>{log('Reinició el hotel con un escenario nuevo');toast('Hotel reiniciado para todos');});},'Reiniciar para todos',true);},
 mode(el){setMode(el.dataset.m);},
 'grade-detail'(el){gradeDetail(el.dataset.id);},
 'export-grades'(){const us=SH.users.filter(u=>u.role!=='admin').sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  const rows=[['Estudiante','Usuario'].concat(RETOS.map(R=>'Reto '+R.n),['Nota automática','Nota escrita','Nota final'])].concat(us.map(u=>{const g=GR[u.id]||{},c=calc(g);return [u.name,u.user].concat(RETOS.map(R=>retoProgress(R,g.auto||{})),[g1(c.auto),g1(c.written),g1(c.final)]);}));
  const tsv=rows.map(r=>r.join('\t')).join('\n');openModal('Exportar calificaciones',`<p>Copia y pega en Excel.</p><textarea id="tsv" rows="9" readonly style="font-size:12px;white-space:pre">${esc(tsv)}</textarea><div class="actions"><button class="btn ghost" data-act="close-modal">Cerrar</button><button class="btn" data-act="copy">Copiar datos</button></div>`,{nofocus:true});},
 help(){openModal('Atajos de teclado',`<table class="tbl"><tbody>${NAV.map(([k,l,n])=>`<tr><td><kbd class="k">${n}</kbd></td><td>Ir a ${l}</td></tr>`).join('')}<tr><td><kbd class="k">N</kbd></td><td>Nueva reserva</td></tr><tr><td><kbd class="k">/</kbd></td><td>Ir al buscador</td></tr><tr><td><kbd class="k">Esc</kbd></td><td>Cerrar la ventana abierta</td></tr><tr><td><kbd class="k">?</kbd></td><td>Ver esta ayuda</td></tr></tbody></table>`,{nofocus:true});}
};

document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=ACTS[el.dataset.act];if(f)f(el,e);});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,d={};new FormData(f).forEach((v,k)=>{d[k]=v;});const id=f.getAttribute('id')||f.dataset.form;if(FORMS[id])FORMS[id](d,f);});
document.addEventListener('input',e=>{if(e.target.id==='qres'){qRes=e.target.value;$('#tbody').innerHTML=resRows();}if(e.target.id==='qg'){qG=e.target.value;$('#tbody').innerHTML=guestRows();}});
function gradeDetail(id){const u=SH.users.find(x=>x.id===id);if(!u)return;const g=GR[id]||{},c=calc(g),au=g.auto||{},ts=g.teacher||{},an=g.answers||{},qz=g.quiz||{};
  openModal(esc(u.name),`<div class="kpis" style="margin-bottom:12px"><div class="kpi"><b>${g1(c.auto)}</b><small>Automática</small></div><div class="kpi"><b>${g1(c.written)}</b><small>Escrita (${c.graded}/${c.totalW})</small></div><div class="kpi"><b>${g1(c.final)}</b><small>Final</small></div></div>
  ${RETOS.map(R=>`<h2 style="margin-top:14px">Reto ${R.n}: ${esc(R.t)}</h2>${R.tasks.map(t=>t.k==='write'?`<div class="chk"><span class="ic ${an[t.id]?'info':'pend'}">✎</span><div class="body"><b>${esc(t.t)}</b><div class="answer">${an[t.id]?esc(an[t.id]):'<span class="muted">Sin responder</span>'}</div><label style="flex-direction:row;align-items:center;gap:8px;margin-top:6px">Nota<select data-grade="${id}" data-tid="${t.id}" style="width:90px"><option value="">—</option>${[1,1.5,2,2.5,3,3.5,4,4.5,5].map(n=>`<option ${+ts[t.id]===n?'selected':''}>${n.toFixed(1)}</option>`).join('')}</select></label></div></div>`:`<div class="chk"><span class="ic ${au[t.id]?'ok':'bad'}">${au[t.id]?'✓':'✗'}</span><div class="body"><b>${esc(t.t)}</b>${t.k==='quiz'&&qz[t.id]?`<small>Respondió: ${esc(qz[t.id])}</small>`:''}</div></div>`).join('')}`).join('')}`,{wide:true,nofocus:true});}
document.addEventListener('change',e=>{
  if(e.target.dataset.grade){const id=e.target.dataset.grade,tid=e.target.dataset.tid,v=e.target.value===''?null:+e.target.value;GR[id]=GR[id]||{};GR[id].teacher=GR[id].teacher||{};GR[id].teacher[tid]=v;W(B.saveGrade(id,{teacher:{[tid]:v}}));toast('Nota guardada');return;}if(e.target.id==='fres'){fRes=e.target.value;$('#tbody').innerHTML=resRows();}if(e.target.id==='posdest'){$('#posm').style.display=e.target.value==='cash'?'':'none';}
  if(e.target.dataset.role){const u=S.users.find(x=>x.id===e.target.dataset.role);u.role=e.target.value;W(B.patch('users',u.id,{role:u.role}));toast(`${u.name} ahora es ${ROLES[u.role]}`);}});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&modalOpen()){closeModal();return;}
  if(!READY||!ME()||!S.config||modalOpen())return;const t=e.target.tagName;if(t==='INPUT'||t==='TEXTAREA'||t==='SELECT'||e.ctrlKey||e.metaKey||e.altKey)return;
  const n=navItems().find(x=>x[2]===e.key);if(n){view=n[0];if(MODE!=='shared'){M().keys=(M().keys||0)+1;persistSoon();}render();return;}
  if(e.key==='n'||e.key==='N'){e.preventDefault();resForm();return;}
  if(e.key==='/'){const s=$('#content input[type=search]');if(s){e.preventDefault();s.focus();}return;}
  if(e.key==='?')ACTS.help();
});

/* ---------- Arranque ---------- */
function onData(d){SH.config=d.config||null;COLS.forEach(c=>SH[c]=d[c]||[]);SH.log.sort((a,b)=>b.ts-a.ts);READY=true;
  if(MODE==='shared')S=SH;else S.users=SH.users;

  if(CUR&&!ME()&&B.mode==='firebase'){/* perfil aún creándose */}
  scheduleRender();}
function onAuth(id){const changed=CUR!==id;if(changed){flushPV();MODE='shared';pvKind=null;S=SH;GR={};lastG='';if(gradesUnsub){try{gradesUnsub();}catch(e){}gradesUnsub=null;}}CUR=id;if(!id)loginTab='in';if(changed){view='hoy';rackStart=null;cart=[];closeModal();if(B.mode==='firebase')READY=false;}render();}
async function boot(){
  render();
  try{B=FIREBASE_CONFIG.apiKey?await firebaseBackend():demoBackend();}
  catch(e){console.error(e);$('#root').innerHTML=shell('<p>No se pudo conectar con la base de datos. Revisa tu conexión a internet y la configuración de Firebase.</p>');return;}
  B.init(onData,onAuth);
}
boot();
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{});}
window.addEventListener('pagehide',flushPV);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushPV();});
})();

</script>
</body>
</html>

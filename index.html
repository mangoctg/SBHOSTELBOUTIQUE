<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --bg:#F3F7F8;--panel:#FFFFFF;--ink:#1C2B30;--muted:#62757B;--line:#DCE6E8;--soft:#EDF4F5;
  --accent:#0E8C88;--accent-ink:#FFFFFF;--accent-soft:#DDF2F0;
  --ok:#1F9D5B;--warn:#D97706;--danger:#D93636;--dot:#E5383B;
  --s-conf:#2F6FE0;--s-in:#1F9D5B;--s-out:#9AA5A9;--s-canc:#D64545;--s-ns:#8E5BD6;
  --r-clean:#1F9D5B;--r-dirty:#E8702A;--r-block:#8A949A;
  color-scheme:light;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
#root{height:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1{font-size:20px;margin:0;font-weight:800;letter-spacing:-.01em}
h2{font-size:15px;margin:0 0 10px;font-weight:700}
p{margin:0 0 8px}
small,.muted{color:var(--muted)}

.app{display:grid;grid-template-columns:228px minmax(0,1fr);height:100%}
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px;overflow:auto}
.brand{padding:4px 12px 18px;color:var(--accent);font-weight:800;font-size:22px;letter-spacing:-.02em;line-height:1.1}
.brand span{display:block;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:4px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;padding:9px 12px;border-radius:8px;cursor:pointer;text-align:left;color:#3D5157}
.nav button:hover{background:var(--soft)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.nav kbd{font:600 11px Manrope,sans-serif;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.nav .sep{height:1px;background:var(--line);margin:10px 8px}
.side .hotel{margin-top:auto;padding:14px 12px 0;font-size:12px;color:var(--muted)}
.main{display:flex;flex-direction:column;min-width:0;height:100%;overflow:hidden}
.top{display:flex;align-items:center;gap:10px;padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.bizdate{display:flex;flex-direction:column;line-height:1.2}
.bizdate small{font-size:11px}
.bizdate b{font-weight:700}
.top .who{font-size:13px;color:var(--muted)}
.grow{flex:1}
.content{flex:1;overflow:auto;padding:20px}
.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}

.btn{background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:var(--panel);color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--soft);filter:none}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.sm{padding:5px 10px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
label.check{flex-direction:row;align-items:flex-start;gap:8px;font-weight:500;color:var(--ink);font-size:13px}
input,select,textarea{background:#FAFCFC;border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);font-size:14px;width:100%;min-width:0}
input[type=checkbox]{width:auto;margin-top:3px}
textarea{resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.span2{grid-column:span 2}.span3{grid-column:1/-1}
.form-err{color:var(--danger);font-weight:600;font-size:13px;min-height:1em;margin:10px 0 0}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi b{display:block;font-size:24px;font-weight:800;letter-spacing:-.02em}
.kpi small{font-size:12px}
.scroll{overflow-x:auto;max-width:100%}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--soft)}
.tbl .num{text-align:right;white-space:nowrap}
.empty{color:var(--muted);padding:14px 4px;font-size:13px}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;color:#fff;white-space:nowrap;vertical-align:middle}
.s-confirmada{background:var(--s-conf)}.s-hospedado{background:var(--s-in)}.s-salida{background:var(--s-out)}.s-cancelada{background:var(--s-canc)}.s-noshow{background:var(--s-ns)}
.r-limpia{background:var(--r-clean)}.r-sucia{background:var(--r-dirty)}.r-bloqueada{background:var(--r-block)}
.b-warn{background:#FEF3C7;color:#92400E}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
.reddot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--dot);vertical-align:middle;margin-left:6px}
.warnflag{display:inline-block;font-size:11px;font-weight:700;color:#92400E;background:#FEF3C7;border:1px dashed var(--warn);border-radius:6px;padding:1px 6px;margin-left:6px;white-space:nowrap}
.list-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:0}
.list-row .who{flex:1;min-width:0}
.list-row .who b{display:block}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:-6px 0 12px;align-items:center}

.rack-wrap{overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;max-height:calc(100% - 100px)}
.rack{border-collapse:separate;border-spacing:0;min-width:100%}
.rack th,.rack td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);height:48px;padding:0}
.rack thead th{min-width:74px;font-size:11px;color:var(--muted);font-weight:600;padding:6px 4px;text-align:center;background:var(--panel);position:sticky;top:0;z-index:3}
.rack thead th b{display:block;font-size:15px;color:var(--ink)}
.rack .rk{position:sticky;left:0;background:var(--panel);z-index:2;text-align:left;padding:0 12px;min-width:118px;font-weight:700;white-space:nowrap}
.rack thead .rk{z-index:4}
.rack .rk small{display:block;font-weight:500;font-size:11px}
.rack td.free{cursor:cell}
.rack td.free:hover{background:var(--soft)}
.rack td.blocked{background:repeating-linear-gradient(135deg,transparent 0 6px,rgba(138,148,154,.18) 6px 8px)}
.rack .today{background:rgba(14,140,136,.07)}
.rack thead th.today{color:var(--accent)}
.rack thead th.today b{color:var(--accent)}
.bar{position:relative;display:block;width:calc(100% - 6px);margin:0 3px;height:38px;border:0;border-radius:7px;color:#fff;font-weight:700;font-size:12px;text-align:left;padding:0 18px 0 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;line-height:1.15}
.bar small{display:block;color:rgba(255,255,255,.9);font-weight:500;font-size:10.5px;overflow:hidden;text-overflow:ellipsis}
.bar.s-confirmada{background:var(--s-conf)}.bar.s-hospedado{background:var(--s-in)}.bar.s-salida{background:var(--s-out)}
.bar.noreg{outline:2px dashed var(--warn);outline-offset:-2px;background-image:repeating-linear-gradient(135deg,transparent 0 8px,rgba(255,255,255,.14) 8px 12px)}
.bar .due{position:absolute;top:5px;right:6px;width:10px;height:10px;border-radius:50%;background:var(--dot);box-shadow:0 0 0 2px #fff}

.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.room{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;border-top:5px solid var(--r-clean)}
.room.sucia{border-top-color:var(--r-dirty)}.room.bloqueada{border-top-color:var(--r-block)}
.room .n{font-size:24px;font-weight:800}
.room .btns{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.pos{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(280px,1fr);gap:16px}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.prod{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:left;cursor:pointer}
.prod:hover{border-color:var(--accent)}
.prod b{display:block;margin-bottom:4px}

.chk{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.chk:last-child{border-bottom:0}
.chk .ic{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;font-size:13px}
.chk .ic.ok{background:var(--ok)}.chk .ic.bad{background:var(--danger)}.chk .ic.info{background:var(--warn)}
.chk .body{flex:1;min-width:0}
.chk .body>b{display:block;margin-bottom:4px}

.backdrop{position:fixed;inset:0;background:rgba(28,43,48,.35);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:var(--panel);border-radius:14px;width:100%;max-width:680px;max-height:92%;overflow:auto;padding:20px;box-shadow:0 20px 50px rgba(28,43,48,.2)}
.modal.wide{max-width:860px}
.modal-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:14px}
.modal-head h1{flex:1}
.x{background:none;border:0;font-size:24px;line-height:1;cursor:pointer;color:var(--muted);padding:2px 6px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px 16px;margin-bottom:14px}
.facts div small{display:block;font-size:11px}
.balance{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--soft);border-radius:10px;padding:10px 14px;margin:10px 0;font-weight:700}
.balance b{font-size:18px;white-space:nowrap}
.note{background:#FFF7E6;border-left:4px solid var(--warn);padding:8px 12px;border-radius:6px;font-size:13px;margin-bottom:12px}
.note.red{background:#FDECEC;border-left-color:var(--danger)}
.toast{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;padding:11px 16px;border-radius:10px;font-weight:600;z-index:60;max-width:min(440px,calc(100% - 32px));box-shadow:0 8px 24px rgba(0,0,0,.18)}
.toast.err{background:var(--danger)}

.login{min-height:100%;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,#E4F4F2,#F3F7F8 60%)}
.login-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px;width:100%;max-width:400px;box-shadow:0 12px 40px rgba(14,140,136,.08)}
.login .brand{padding:0 0 18px;font-size:30px}
.tabs{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:10px;margin-bottom:16px}
.tabs button{flex:1;border:0;background:none;padding:8px;border-radius:7px;cursor:pointer;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--panel);color:var(--ink)}
.stack{display:flex;flex-direction:column;gap:12px}
.hint{font-size:12px;color:var(--muted);background:var(--soft);border-radius:8px;padding:10px 12px;margin-top:16px}
.case{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.case:last-child{border-bottom:0}
.case b{display:block;margin-bottom:2px}
.case.done b{text-decoration:line-through;color:var(--muted)}
.bars .row{display:grid;grid-template-columns:86px 1fr 44px;gap:10px;align-items:center;font-size:12px;margin-bottom:6px}
.bars .track{background:var(--soft);border-radius:4px;height:14px;overflow:hidden}
.bars .fill{background:var(--accent);height:100%}
kbd.k{font:700 12px Manrope,sans-serif;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 7px;background:var(--bg)}

@media (max-width:860px){
  .app{grid-template-columns:1fr;grid-template-rows:auto auto minmax(0,1fr)}
  .main{display:contents}
  .side{flex-direction:row;align-items:center;padding:6px 8px;overflow-x:auto;gap:6px;border-right:0;border-bottom:1px solid var(--line);order:2}
  .top{order:1;padding:8px 12px;gap:6px}
  .content{order:3;padding:12px;min-height:0}
  .brand,.side .hotel,.nav kbd,.nav .sep{display:none}
  .nav{flex-direction:row;gap:2px}
  .nav button{white-space:nowrap;padding:7px 10px;font-size:13px}
  .top .who,.hide-m{display:none}
  .grid2,.grid3{grid-template-columns:1fr}
  .span2{grid-column:auto}
  .pos{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .kpi b{font-size:20px}
  h1{font-size:18px}
  .rack thead th{min-width:60px}
  .rack .rk{min-width:76px;padding:0 8px}
  .rack-wrap{max-height:none}
  .backdrop{padding:0;align-items:flex-end}
  .modal,.modal.wide{max-height:94%;border-radius:14px 14px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
  .actions .btn{flex:1 1 auto}
}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .18s ease-out}@keyframes pop{from{transform:translateY(8px);opacity:0}}}
@media print{.side,.top,.toolbar,.actions,.x{display:none!important}.backdrop{position:static;background:none}.modal{box-shadow:none;max-height:none}}

.modal .tabs{margin-bottom:14px}
label.case{flex-direction:row;align-items:flex-start;font-size:14px;font-weight:400;color:var(--ink);cursor:pointer}
label.case>span{display:block;min-width:0}
label.case>span>span{display:block}
.case .think{display:block;margin-top:6px;font-style:italic;color:#0B6E6A}
.case .guide{display:block;margin-top:6px;font-size:12px;background:#FFF7E6;border-left:3px solid var(--warn);padding:6px 10px;border-radius:6px;color:#7A4A0A}

function demoBackend(){
  const K='sbhb-demo-v1';let st=null;
  try{st=JSON.parse(localStorage.getItem(K)||'null');}catch(e){}
  if(!st||!st.data){st={accounts:[{uid:'u-admin',user:ADMIN_USER,ph:'e940634756994bd7b72edc3b511180d8220214e43b3d161ef0a8c1867d648ebc'}],session:null,data:{config:null}};COLS.forEach(c=>st.data[c]={});st.data.users['u-admin']={id:'u-admin',name:'Profesor',user:ADMIN_USER,role:'admin',active:true,practice:[],created:Date.now()};}
  let onData,onAuth,gcb=null;
  const emitG=()=>{if(!gcb)return;const all=st.data.grades||{};gcb.cb(gcb.adm?clone(all):(all[st.session]?{[st.session]:clone(all[st.session])}:{}));};
  const persist=()=>{try{localStorage.setItem(K,JSON.stringify(st));}catch(e){}};
  const emit=()=>{const d=clone(st.data),o={config:d.config};COLS.forEach(c=>o[c]=Object.values(d[c]));onData(o);};
  const commit=()=>{persist();setTimeout(emit,0);};
  const ok=()=>{if(!st.session)throw{code:'permission-denied'};};
  return {mode:'demo',
    init(od,oa){onData=od;onAuth=oa;emit();oa(st.session);},
    async signIn(user,pass){const a=st.accounts.find(x=>x.user===user&&x.ph===H(user,pass));if(!a)throw{code:'auth/invalid-credential'};st.session=a.uid;persist();onAuth(a.uid);},
    async signUp(name,user,pass){if(st.accounts.some(x=>x.user===user))throw{code:'auth/email-already-in-use'};const id='u'+uid();st.accounts.push({uid:id,user,ph:H(user,pass)});st.data.users[id]={id,name,user,role:user===ADMIN_USER?'admin':'recepcion',active:true,practice:[],created:Date.now()};st.session=id;persist();emit();onAuth(id);},
    async signOut(){st.session=null;persist();onAuth(null);},
    async changePass(o,n){const a=st.accounts.find(x=>x.uid===st.session);if(!a||a.ph!==H(a.user,o))throw{code:'auth/wrong-password'};a.ph=H(a.user,n);persist();},
    async put(col,obj){ok();if(col==='config')st.data.config=clone(obj);else st.data[col][obj.id]=clone(obj);
      if(col==='log'){const ks=Object.keys(st.data.log);if(ks.length>300){ks.sort((a,b)=>st.data.log[a].ts-st.data.log[b].ts).slice(0,ks.length-300).forEach(k=>delete st.data.log[k]);}}commit();},
    async patch(col,id,f){ok();const t=col==='config'?st.data.config:st.data[col][id];if(!t)throw{code:'not-found'};Object.assign(t,clone(f));commit();},
    async push(col,id,field,items){ok();const t=st.data[col][id];if(!t)throw{code:'not-found'};t[field]=t[field]||[];items.forEach(it=>{const s=JSON.stringify(it);if(!t[field].some(x=>JSON.stringify(x)===s))t[field].push(clone(it));});commit();},
    async del(col,id){ok();delete st.data[col][id];commit();},
    async loadPrivate(kind){return localStorage.getItem('sbhb-demo-'+kind+'-'+st.session);},
    async savePrivate(kind,json){try{localStorage.setItem('sbhb-demo-'+kind+'-'+st.session,json);}catch(e){}},
    watchGrades(adm,cb){gcb={adm,cb};emitG();return ()=>{gcb=null;};},
    async saveGrade(id,p){ok();st.data.grades=st.data.grades||{};const g=st.data.grades[id]||(st.data.grades[id]={});deepMerge(g,clone(p));persist();setTimeout(emitG,0);},
    async transferir(a,b,nombre,usuario){ok();st.data.grades=st.data.grades||{};
      const res={grades:false,practice:false,sandbox:false};
      if(st.data.grades[a]){const d=clone(st.data.grades[a]);delete d.id;delete d.name;delete d.user;
        st.data.grades[b]=Object.assign({},st.data.grades[b]||{},d,{id:b,name:nombre,user:usuario,updated:Date.now()});res.grades=true;}
      [['practice','retos'],['sandbox','libre']].forEach(function(p){const key='sbhb-demo-'+p[1]+'-';
        try{const v=localStorage.getItem(key+a);if(v){localStorage.setItem(key+b,v);res[p[0]]=true;}}catch(e){}});
      const ua=st.data.users[a],ub=st.data.users[b];
      if(ua&&ub&&ua.practice)ub.practice=clone(ua.practice);
      if(ua)ua.active=false;
      persist();setTimeout(emitG,0);setTimeout(emit,0);return res;},
    async reset(sd){ok();['rooms','guests','res','sales','closures','audits','log'].forEach(c=>st.data[c]={});['rooms','guests','res'].forEach(c=>sd[c].forEach(o=>st.data[c][o.id]=clone(o)));st.data.config=clone(sd.config);commit();}
  };
}

  let onData,unsubs=[],data={};

  const fail=e=>{console.error(e);if(e&&e.code==='permission-denied')toast('No tienes permiso para ver los datos. Revisa las reglas de Firestore.',true);};
  const stop=()=>{unsubs.forEach(u=>u());unsubs=[];data={config:undefined};};
  const start=()=>{stop();
    unsubs.push(F.onSnapshot(F.doc(db,'config','main'),s=>{data.config=s.exists()?s.data():null;emit();},fail));
    COLS.forEach(c=>{const q=c==='log'?F.query(F.collection(db,'log'),F.orderBy('ts','desc'),F.limit(60)):F.collection(db,c);
      unsubs.push(F.onSnapshot(q,s=>{data[c]=s.docs.map(d=>Object.assign({},d.data(),{id:d.id}));emit();},fail));});};
  const ref=(col,id)=>F.doc(db,col,col==='config'?'main':id);
  return {mode:'firebase',
    init(od,oa){onData=od;AU.onAuthStateChanged(auth,u=>{if(u)start();else stop();oa(u?u.uid:null);});},
    signIn:(user,pass)=>AU.signInWithEmailAndPassword(auth,mail(user),pass),
    async signUp(name,user,pass){const c=await AU.createUserWithEmailAndPassword(auth,mail(user),pass);await F.setDoc(F.doc(db,'users',c.user.uid),{id:c.user.uid,name,user,role:user===ADMIN_USER?'admin':'recepcion',active:true,practice:[],created:Date.now()});},
    signOut:()=>AU.signOut(auth),
    async changePass(o,n){const u=auth.currentUser;await AU.reauthenticateWithCredential(u,AU.EmailAuthProvider.credential(u.email,o));await AU.updatePassword(u,n);},
    put:(col,o)=>F.setDoc(ref(col,o.id),clone(o)),
    patch:(col,id,f)=>F.updateDoc(ref(col,id),clone(f)),
    push:(col,id,field,items)=>F.updateDoc(ref(col,id),{[field]:F.arrayUnion.apply(null,clone(items))}),
    del:(col,id)=>F.deleteDoc(ref(col,id)),
    async loadPrivate(kind){const c=PRIV[kind]||kind;const s=await F.getDoc(F.doc(db,c,auth.currentUser.uid));return s.exists()?s.data().json:null;},
    savePrivate:(kind,json)=>F.setDoc(F.doc(db,PRIV[kind]||kind,auth.currentUser.uid),{json,updated:Date.now()}),
    watchGrades(adm,cb){const u=adm?F.onSnapshot(F.collection(db,'grades'),s=>{const m={};s.forEach(d=>m[d.id]=d.data());cb(m);},fail):F.onSnapshot(F.doc(db,'grades',auth.currentUser.uid),s=>cb(s.exists()?{[s.id]:s.data()}:{}),fail);unsubs.push(u);return u;},
    saveGrade:(id,p)=>F.setDoc(F.doc(db,'grades',id),clone(p),{merge:true}),
    async transferir(a,b,nombre,usuario){
      const res={grades:false,practice:false,sandbox:false};
      const g=await F.getDoc(F.doc(db,'grades',a));
      if(g.exists()){const d=g.data();delete d.id;delete d.name;delete d.user;
        await F.setDoc(F.doc(db,'grades',b),Object.assign({},d,{id:b,name:nombre,user:usuario,updated:Date.now()}),{merge:true});res.grades=true;}
      for(const c of ['practice','sandbox']){const sn=await F.getDoc(F.doc(db,c,a));
        if(sn.exists()){await F.setDoc(F.doc(db,c,b),sn.data());res[c]=true;}}
      const u=await F.getDoc(F.doc(db,'users',a));
      if(u.exists()&&u.data().practice)await F.updateDoc(F.doc(db,'users',b),{practice:u.data().practice});
      await F.updateDoc(F.doc(db,'users',a),{active:false});
      return res;},

    async reset(sd){const ops=[];
      ['rooms','guests','res','sales','closures','audits'].forEach(c=>(S[c]||[]).forEach(o=>ops.push(['d',c,o.id])));
      const ls=await F.getDocs(F.collection(db,'log'));ls.forEach(d=>ops.push(['d','log',d.id]));
      ['rooms','guests','res'].forEach(c=>sd[c].forEach(o=>ops.push(['s',c,o])));ops.push(['s','config',sd.config]);
      for(let i=0;i<ops.length;i+=400){const b=F.writeBatch(db);ops.slice(i,i+400).forEach(([t,c,o])=>{if(t==='d')b.delete(ref(c,o));else b.set(ref(c,o.id),clone(o));});await b.commit();}}
  };
}

const biz=()=>S.config.biz;
const room=id=>S.rooms.find(r=>r.id===id)||{id,num:'?',type:'EST',status:'limpia'};
const rtype=code=>(S.config.types||[]).find(t=>t.code===code)||{name:'?',rate:0,cap:2};
const guest=id=>S.guests.find(g=>g.id===id)||{nombre:'?',apellido:''};

const occupying=r=>r.status!=='cancelada'&&r.status!=='noshow';
const folio=r=>r.folio||[];
const posted=r=>r.posted||[];
const sumF=(r,t)=>folio(r).filter(f=>f.type===t).reduce((a,f)=>a+f.amount,0);
const stayDates=r=>{const a=[];for(let d=r.in;d<r.out;d=addDays(d,1))a.push(d);return a;};
const unpostedAll=r=>stayDates(r).filter(d=>!posted(r).includes(d)).length;
const stayLimit=r=>{let lim=r.out<biz()?r.out:biz();if(lim<=r.in)lim=addDays(r.in,1);return lim;};
const unpostedStayed=r=>stayDates(r).filter(d=>d<stayLimit(r)&&!posted(r).includes(d)).length;
const est=r=>{if(!occupying(r))return 0;if(r.status==='salida')return sumF(r,'cargo')-sumF(r,'pago');return sumF(r,'cargo')+unpostedAll(r)*r.rate-sumF(r,'pago');};
const due=r=>r.status==='hospedado'?sumF(r,'cargo')+unpostedStayed(r)*r.rate-sumF(r,'pago'):est(r);
const regOk=g=>!!(g.docNum&&g.nombre&&g.apellido&&g.nac&&g.birth&&g.city&&g.phone&&g.dataOk);
const noReg=r=>(r.status==='hospedado'||r.status==='salida')&&!regOk(guest(r.guestId));
const rateOff=r=>(r.status==='hospedado'||r.status==='confirmada')&&!r.rateOk&&r.rate<rtype(room(r.roomId).type).rate*0.6;

rack(){
  const T=biz(),days=[...Array(14)].map((_,i)=>addDays(rackStart,i)),end=addDays(rackStart,14);
  let h=`<div class="toolbar"><h1>Rack</h1><span class="grow"></span><button class="btn ghost sm" data-act="rack" data-d="-7">‹ Semana</button><button class="btn ghost sm" data-act="rack" data-d="0">Hoy</button><button class="btn ghost sm" data-act="rack" data-d="7">Semana ›</button><button class="btn ghost sm" data-act="ota">Simular reserva de OTA</button></div>
  <div class="legend"><span><i class="dot s-confirmada"></i>Pendiente de check-in</span><span><i class="dot s-hospedado"></i>En casa</span><span><i class="dot s-salida"></i>Check-out</span><span><i class="dot" style="background:var(--dot)"></i>Saldo pendiente</span><span class="warnflag" style="margin:0">Sin registro</span><span><i class="dot r-sucia"></i>Hab. sucia</span></div>
  <div class="rack-wrap"><table class="rack"><thead><tr><th class="rk">Hab.</th>${days.map(d=>`<th class="${d===T?'today':''}">${dow(d)}<b>${+d.slice(8)}</b>${d.slice(8)==='01'||d===rackStart?MON[+d.slice(5,7)-1]:''}</th>`).join('')}</tr></thead><tbody>`;
  S.rooms.slice().sort((a,b)=>a.num.localeCompare(b.num)).forEach(rm=>{
    h+=`<tr><th class="rk"><i class="dot r-${rm.status}" title="${RST[rm.status]}"></i>${rm.num}<small>${esc(rtype(rm.type).name)}</small></th>`;
    const list=S.res.filter(r=>r.roomId===rm.id&&occupying(r)&&r.in<end&&r.out>rackStart);
    let i=0;
    while(i<14){const d=days[i];const r=list.find(x=>x.in<=d&&x.out>d);
      if(r){const last=r.out<end?r.out:end;const span=Math.max(1,diff(d,last));const g=guest(r.guestId);const nr=noReg(r);
        h+=`<td colspan="${span}"><button class="bar s-${r.status}${nr?' noreg':''}" data-act="open-res" data-id="${r.id}" title="${esc(gname(g))}, ${fmtD(r.in)} a ${fmtD(r.out)}">${est(r)>0?'<i class="due" aria-label="Saldo pendiente"></i>':''}${esc(gname(g))}<small>${nr?'Sin registro, ':''}${rateOff(r)?'Revisar tarifa, ':''}${esc(r.source)}</small></button></td>`;i+=span;}
      else{const blocked=rm.status==='bloqueada';h+=`<td class="${blocked?'blocked':'free'} ${d===T?'today':''}" ${blocked||d<T?'':`data-act="new-res" data-room="${rm.id}" data-date="${d}"`}></td>`;i++;}
    }
    h+='</tr>';
  });
  return h+'</tbody></table></div>';
},

function myMoves(userId){
  const last=S.closures.filter(c=>c.userId===userId).reduce((a,c)=>Math.max(a,c.ts),0);const mv=[];
  S.res.forEach(r=>folio(r).forEach(f=>{if(f.type==='pago'&&f.userId===userId&&f.ts>last)mv.push({d:f.d,ts:f.ts,concept:f.concept,ref:r.code+', hab. '+room(r.roomId).num,method:f.method,amount:f.amount});}));
  S.sales.forEach(s=>{if(s.userId===userId&&s.ts>last)mv.push({d:s.d,ts:s.ts,concept:s.concept,ref:'Venta de contado',method:s.method,amount:s.amount});});
  return mv.sort((a,b)=>a.ts-b.ts);
}

function otaSim(silent){
  const T=biz(),used=new Set(S.guests.map(g=>g.nombre+g.apellido));const src=pick(['Booking.com','Expedia','Airbnb']);
  for(let t=0;t<40;t++){const inD=addDays(T,ri(10)),outD=addDays(inD,1+ri(4));
    const list=S.rooms.filter(rm=>rm.status!=='bloqueada'&&available(rm.id,inD,outD));if(!list.length)continue;
    const rm=pick(list),rate=Math.round(rtype(rm.type).rate*(src==='Airbnb'?1:1.1)/1000)*1000;
    const tmp=[];const g=newGuest(tmp,used,false,Math.random()<.5);S.guests.push(g);putDoc('guests',g);
    const r={id:uid(),code:newCode(),guestId:g.id,roomId:rm.id,in:inD,out:outD,adults:Math.min(2,rtype(rm.type).cap),children:0,source:src,status:'confirmada',rate,notes:src==='Booking.com'?'Pago en el hotel. Tarjeta de garantía en el extranet.':'Prepagada por el canal.',created:Date.now(),by:src,folio:[],posted:[],rateOk:false};
    if(src!=='Booking.com')r.folio.push({id:uid(),d:T,ts:Date.now(),type:'pago',concept:'Prepago del canal',amount:rate*diff(inD,outD),method:'Tarjeta virtual OTA',user:src,userId:'ota',kind:''});
    S.res.push(r);putDoc('res',r);log(`Entró la reserva ${r.code} desde ${src} para ${gname(g)}`);
    if(!silent){render();toast(`Nueva reserva de ${src}: ${r.code}, hab. ${rm.num}, llega el ${fmtD(inD)}`);}return r;}
  if(!silent)toast('No hay disponibilidad en los próximos 10 días para simular una reserva.',true);return null;
}
function closeDay(){
  const T=biz(),u=ME();
  if(S.audits.some(a=>a.d===T)){toast('Este día ya fue cerrado por otro auditor.',true);return;}
  const inh=S.res.filter(r=>r.status==='hospedado'&&r.in<=T&&r.out>T);
  let roomRev=0;inh.forEach(r=>{if(!posted(r).includes(T)){addFolio(r,[nightEntry(r,T,room(r.roomId).num)]);addPosted(r,[T]);roomRev+=r.rate;}});
  const avail=S.rooms.filter(r=>r.status!=='bloqueada').length,occ=inh.length;
  let other=0;const pay={};
  S.res.forEach(r=>folio(r).forEach(f=>{if(f.d!==T)return;if(f.type==='cargo'&&f.kind!=='aloj')other+=f.amount;if(f.type==='pago'&&f.userId!=='ota'&&f.userId!=='sys')pay[f.method]=(pay[f.method]||0)+f.amount;}));
  S.sales.forEach(s=>{if(s.d===T){other+=s.amount;pay[s.method]=(pay[s.method]||0)+s.amount;}});
  const cnt=k=>S.res.filter(r=>r[k]===T).length;
  const a={id:'a-'+T,d:T,ts:Date.now(),by:u.name,occ,avail,occPct:avail?Math.round(occ/avail*100):0,roomRev,other,adr:occ?Math.round(roomRev/occ):0,revpar:avail?Math.round(roomRev/avail):0,pay,arr:cnt('ciD'),dep:cnt('coD'),ns:cnt('nsD'),cx:cnt('cxD'),withBal:S.res.filter(r=>r.status==='hospedado'&&due(r)>0).length};
  S.audits.push(a);putDoc('audits',a);patchCfg({biz:addDays(T,1)});rackStart=addDays(biz(),-2);
  let n=0;const k=ri(3);for(let i=0;i<k;i++)if(otaSim(true))n++;
  S.rooms.forEach(rm=>{if(rm.status==='limpia'&&S.res.some(r=>r.roomId===rm.id&&r.status==='hospedado')&&Math.random()<.5){rm.status='sucia';putDoc('rooms',rm);}});
  log(`Cerró el día ${fmtD(T)}. Ocupación ${a.occPct}%, alojamiento ${money(roomRev)}`);render();auditReport(a.id);
  toast(`Día cerrado. Nueva fecha del hotel: ${fmtD(biz())}${n?'. Entraron '+plural(n,'reserva')+' por OTA durante la noche':''}`);
}

</script><script type="text/plain" id="app-clase-pms"><!doctype html>

<style>

(function(){
 const slides=[...document.querySelectorAll('.slide')];let i=0;
 function go(n){i=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,k)=>{s.classList.toggle('on',k===i);if(k===i)s.scrollTop=0;});
  document.getElementById('prog').style.width=((i+1)/slides.length*100)+'%';
  document.getElementById('tag').textContent=(i+1)+' / '+slides.length;
  window.dispatchEvent(new CustomEvent('deck:go',{detail:i}));}
 document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(i+ +b.dataset.go));
 document.addEventListener('keydown',e=>{
  if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(i+1);}
  if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(i-1);}
  if(e.key==='Home')go(0);if(e.key==='End')go(slides.length-1);});
 let x0=null,y0=null;
 document.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY;},{passive:true});
 document.addEventListener('touchend',e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;
  if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy))go(i+(dx<0?1:-1));x0=null;},{passive:true});
 document.addEventListener('click',e=>{
  const h=e.target.closest('.hook');if(h&&h.querySelector('.reveal'))h.classList.toggle('open');
  const c=e.target.closest('.check');if(c&&c.tagName==='BUTTON')c.classList.toggle('hecho');
  const f=e.target.closest('.fila');if(f)f.classList.toggle('abierta');
  const o=e.target.closest('#op button');if(o){const box=document.getElementById('op');box.classList.add('resuelta');
   [...box.children].forEach(b=>b.classList.toggle('buena',b.dataset.ok==='1'));
   document.getElementById('sello').classList.add('puesto');}});
 document.getElementById('fs').onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});};
 go(0);
 window.deckGo=go;
})();

(function(){
 const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDF2asULlXoNiRFhGn-aqWjyNUBHBG_XhQ",

};
 const DOM='sbhb.app', DOC='deck';
 const $=s=>document.querySelector(s);
 const slides=[...document.querySelectorAll('.slide')];
 const titulo=s=>{const h=s.querySelector('h1,h2');return h?h.textContent.trim():'Diapositiva';};
 let fb=null,rol=null,ultima=0,idx=0;
 const puntero=$('#puntero');
 window.addEventListener('deck:go',e=>{idx=e.detail;if(rol==='control')pinta();if(rol==='pantalla')return;});
 function pinta(){$('#m-ahora').textContent=titulo(slides[idx]);$('#m-sigue').textContent=slides[idx+1]?titulo(slides[idx+1]):'Fin de la presentación';$('#m-cont').textContent=(idx+1)+' de '+slides.length;}
 async function conectar(user,pass){
  const base='https://www.gstatic.com/firebasejs/10.12.2/';
  const [A,AU,F]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]);
  const app=A.initializeApp(FIREBASE_CONFIG),auth=AU.getAuth(app),db=F.getFirestore(app);
  await AU.signInWithEmailAndPassword(auth,user+'@'+DOM,pass);
  fb={F,db,ref:F.doc(db,'control',DOC)};
 }
 function escuchar(){fb.F.onSnapshot(fb.ref,s=>{if(!s.exists())return;const d=s.data();
   if(typeof d.slide==='number'&&d.slide!==idx)window.deckGo(d.slide);
   if(d.pointer){puntero.classList.add('on');puntero.style.left=(d.px*100)+'%';puntero.style.top=(d.py*100)+'%';}
   else puntero.classList.remove('on');});}
 function enviar(o){if(!fb)return;const ahora=Date.now();if(o.px!=null&&ahora-ultima<110)return;ultima=ahora;
   fb.F.setDoc(fb.ref,Object.assign({ts:ahora},o),{merge:true}).catch(()=>{});}
 function abrirPanel(){
  const d=document.createElement('div');d.className='panel';
  d.innerHTML=`<div class="pcaja"><h3>Control remoto</h3><p style="font-size:14px;color:var(--humo);max-width:none">Entra con tu usuario del sistema en el computador y en el celular. El celular manda y el computador obedece.</p>
   <label>Usuario</label><input id="c-user" autocapitalize="none" value="admin">
   <label>Contraseña</label><input id="c-pass" type="password">

   <button class="btn" id="c-pantalla">Este equipo es la pantalla</button>
   <button class="btn sec" id="c-mando">Este equipo es mi control</button>
   <button class="cerrar" id="c-cerrar">Cancelar</button></div>`;
  document.body.appendChild(d);
  const cerrar=()=>d.remove();
  d.querySelector('#c-cerrar').onclick=cerrar;
  const entrar=async modo=>{
   const u=d.querySelector('#c-user').value.trim().toLowerCase(),p=d.querySelector('#c-pass').value;
   const err=d.querySelector('#c-err');err.textContent='Conectando…';
   if(!FIREBASE_CONFIG.apiKey){err.textContent='Falta pegar los datos de Firebase en este archivo.';return;}
   try{await conectar(u,p);}catch(e){err.textContent=(e&&e.code==='auth/invalid-credential')?'Usuario o contraseña incorrectos.':'No se pudo conectar ('+((e&&e.code)||'error')+').';return;}
   rol=modo;cerrar();$('#abrir').style.display='none';
   if(modo==='pantalla'){escuchar();}
   else{$('#mando').classList.add('on');pinta();enviar({slide:idx,pointer:false});}
  };
  d.querySelector('#c-pantalla').onclick=()=>entrar('pantalla');
  d.querySelector('#c-mando').onclick=()=>entrar('control');
 }
 $('#abrir').onclick=abrirPanel;
 $('#m-sig').onclick=()=>{idx=Math.min(slides.length-1,idx+1);pinta();enviar({slide:idx});};
 $('#m-atras').onclick=()=>{idx=Math.max(0,idx-1);pinta();enviar({slide:idx});};
 $('#m-salir').onclick=()=>{$('#mando').classList.remove('on');$('#abrir').style.display='';rol=null;enviar({pointer:false});};
 const pad=$('#pad');
 const mover=e=>{const t=e.touches?e.touches[0]:e,r=pad.getBoundingClientRect();
  const px=Math.min(1,Math.max(0,(t.clientX-r.left)/r.width)),py=Math.min(1,Math.max(0,(t.clientY-r.top)/r.height));
  enviar({px,py,pointer:true});};
 pad.addEventListener('touchstart',e=>{e.preventDefault();pad.classList.add('activo');mover(e);},{passive:false});
 pad.addEventListener('touchmove',e=>{e.preventDefault();mover(e);},{passive:false});
 pad.addEventListener('touchend',()=>{pad.classList.remove('activo');enviar({pointer:false});});
 pad.addEventListener('mousedown',e=>{pad.classList.add('activo');mover(e);
  const mv=ev=>mover(ev),up=()=>{pad.classList.remove('activo');enviar({pointer:false});document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);};
  document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);});
})();

.kpi b{display:block;font-size:24px;font-weight:800;letter-spacing:-.02em}
.kpi small{color:var(--muted);font-size:12px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.bars .row{display:grid;grid-template-columns:96px 1fr 48px;gap:10px;align-items:center;font-size:13px;margin-top:8px}
.bars .track{background:var(--soft);border-radius:4px;height:14px;overflow:hidden}
.bars .fill{background:var(--accent);height:100%}
.rev{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.rev:last-child{border-bottom:0}
.rev small{display:block;color:var(--muted);font-size:13px}
.ic{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:12px;background:var(--muted)}
.ic.ok{background:var(--ok)}.ic.bad{background:var(--danger)}.ic.info{background:var(--warn)}
.scroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line)}
.tbl .num{text-align:right;white-space:nowrap}
.backdrop{position:fixed;inset:0;background:rgba(28,43,48,.4);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.backdrop .card{max-width:640px}
.row2{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.toast{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;padding:12px 16px;border-radius:10px;font-weight:600;z-index:60;max-width:min(420px,calc(100% - 32px))}
.toast.err{background:var(--danger)}

.hero .big,.card-q .big{font-size:21px;line-height:1.3;display:block;margin-bottom:8px}
.steps{margin:10px 0 16px;padding-left:20px}
.steps li{margin-bottom:6px}
.prog{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin:6px 0 4px}
.pfill{height:100%;background:var(--accent);transition:width .3s}
.racehead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:6px}
.racehead b{font-size:17px}
.question{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-weight:700;margin:10px 0}
.road{position:relative;height:380px;border-radius:14px;overflow:hidden;background:linear-gradient(#5B6B70,#46565B);border:4px solid #C9D6D8}
.road.ok{box-shadow:inset 0 0 0 4px var(--ok)}
.road.bad{box-shadow:inset 0 0 0 4px var(--danger)}
.road .lines{position:absolute;left:50%;top:0;bottom:0;width:0;border-left:4px dashed rgba(255,255,255,.65)}
.gate{position:absolute;left:0;right:0;top:6%;display:flex;gap:8px;padding:0 8px}
.gate .door{flex:1;background:#FFF;border:3px solid var(--accent);border-radius:10px;padding:10px 8px;font-weight:700;font-size:14px;text-align:center;min-height:62px;display:grid;place-items:center;cursor:pointer;color:var(--ink);font-family:inherit}
.car{position:absolute;bottom:14px;left:25%;transform:translateX(-50%);font-size:44px;transition:left .18s ease;line-height:1}
.ctrls{display:flex;gap:10px;margin-top:12px}
.ctrls .pad{flex:1;padding:16px;font-size:16px}
.small{font-size:12px}
.opt-btn{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:8px;font-size:15px;cursor:pointer}
.opt-btn:hover{border-color:var(--accent);background:#F2FAF9}
.opt-btn.file{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px}
.slider{width:100%;margin:12px 0 4px}
.warn{background:#FFF7E6;border-left:4px solid var(--warn);padding:8px 12px;border-radius:6px;margin:8px 0}
.ready{font-weight:700;color:var(--accent);text-align:center;margin-top:10px}
.slabel{font-weight:700;color:var(--accent)}
@media (max-width:700px){.page{padding:0 10px 50px}.card{padding:20px}}

.hero .big{font-size:22px;display:block;margin-bottom:8px}
.steps{margin:10px 0 14px;padding-left:20px}.steps li{margin-bottom:6px}
.racehead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:6px 0}
.racehead b{font-size:17px}
.bloque{display:block;width:100%;text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:14px;margin-top:10px;cursor:pointer}
.bloque b{display:block;margin-bottom:4px}
.bloque span{color:var(--muted);font-size:13px;line-height:1.5;display:block}
.bloque.on{border-color:var(--accent);background:#F1FAF9}
.bloque.on b::after{content:" ✓";color:var(--accent)}
.campos{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.campo{background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:10px 14px;font-size:14px;font-weight:600;cursor:pointer}
.campo.on{border-color:var(--accent);background:#E0F2F1;color:var(--accent)}
.entrada{width:100%;font-size:16px;padding:13px;border:2px solid var(--line);border-radius:12px;background:#fff;margin-top:6px}
.entrada:focus{outline:none;border-color:var(--accent)}
.salida{white-space:pre-wrap;background:var(--soft);border-radius:12px;padding:14px;font-size:14px;line-height:1.6;margin:10px 0 0;font-family:inherit}
code{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--soft);padding:2px 6px;border-radius:5px;font-size:.92em}
.row2{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
label{display:block;font-size:13px;font-weight:700;color:var(--muted)}

.hero .big{font-size:40px;display:block;margin-bottom:4px;color:var(--accent)}
.br{display:grid;grid-template-columns:1fr 120px 48px;gap:10px;align-items:center;margin-top:10px;font-size:13px}
.br .et{color:var(--muted);font-weight:600}
.tk{background:var(--soft);border-radius:99px;height:12px;overflow:hidden}
.fl{height:100%;background:var(--accent);transition:width .4s}
.tbl td.falta{color:#C63A5E;font-weight:700}
.row2{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
@media (max-width:620px){.br{grid-template-columns:1fr 70px 42px}}

<script>


(function(){
'use strict';
/* =====================================================================

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDF2asULlXoNiRFhGn-aqWjyNUBHBG_XhQ",

};
const ADMIN_USER='admin', DOMAIN='sbhb.app';

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-3);
const clone=o=>JSON.parse(JSON.stringify(o));
function sha256(ascii){function r(v,a){return(v>>>a)|(v<<(32-a))}var mp=Math.pow,mw=mp(2,32),i,j,res='',words=[],abl=ascii.length*8,hash=[],k=[],pc=0,ic={};for(var c=2;pc<64;c++){if(!ic[c]){for(i=0;i<313;i+=c)ic[i]=c;hash[pc]=(mp(c,.5)*mw)|0;k[pc++]=(mp(c,1/3)*mw)|0}}hash=hash.slice(0,8);ascii+='\x80';while(ascii.length%64-56)ascii+='\x00';for(i=0;i<ascii.length;i++){j=ascii.charCodeAt(i);if(j>>8)return '';words[i>>2]|=j<<((3-i)%4)*8}words[words.length]=((abl/mw)|0);words[words.length]=(abl);for(j=0;j<words.length;){var w=words.slice(j,j+=16),oh=hash;hash=hash.slice(0,8);for(i=0;i<64;i++){var w15=w[i-15],w2=w[i-2],a=hash[0],e=hash[4],t1=hash[7]+(r(e,6)^r(e,11)^r(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(r(w15,7)^r(w15,18)^(w15>>>3))+w[i-7]+(r(w2,17)^r(w2,19)^(w2>>>10)))|0),t2=(r(a,2)^r(a,13)^r(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));hash=[(t1+t2)|0].concat(hash);hash[4]=(hash[4]+t1)|0}for(i=0;i<8;i++)hash[i]=(hash[i]+oh[i])|0}for(i=0;i<8;i++){for(j=3;j+1;j--){var b=(hash[i]>>(j*8))&255;res+=((b<16)?0:'')+b.toString(16)}}return res}
const H=(user,pass)=>sha256(unescape(encodeURIComponent('muelle|'+user+'|'+pass)));


let DA={};
function diagOf(id){const g=GR[id]||{};return g.diag||null;}


const ERR={'auth/invalid-credential':'Usuario o contraseña incorrectos.','auth/wrong-password':'La contraseña no es correcta.','auth/user-not-found':'Usuario o contraseña incorrectos.','auth/invalid-login-credentials':'Usuario o contraseña incorrectos.','auth/email-already-in-use':'Ese usuario ya existe. Escoge otro.','auth/weak-password':'La contraseña debe tener al menos 6 caracteres.','auth/too-many-requests':'Demasiados intentos. Espera un momento.','auth/network-request-failed':'Sin conexión a internet.','permission-denied':'No tienes permiso para esta acción.','auth/operation-not-allowed':'Falta activar Correo electrónico/contraseña en Firebase.','auth/configuration-not-found':'Authentication no está configurado en Firebase.','auth/unauthorized-domain':'Este dominio no está autorizado en Firebase (Authentication > Configuración > Dominios autorizados).'};
const errMsg=e=>{const c=e&&e.code||'';if(ERR[c])return ERR[c];return 'No se pudo completar la acción'+(c?' (código: '+c+')':'')+'. Mándale este código al profesor.';};

/* ---------- Conexiones ---------- */
function demoBackend(){
  const K='sbhb-quiz-demo';let st=null;try{st=JSON.parse(localStorage.getItem(K)||'null');}catch(e){}
  if(!st)st={accounts:[{uid:'u-admin',user:ADMIN_USER,ph:'e940634756994bd7b72edc3b511180d8220214e43b3d161ef0a8c1867d648ebc',name:'Profesor'}],session:null,grades:{}};
  const persist=()=>{try{localStorage.setItem(K,JSON.stringify(st));}catch(e){}};
  let cb=null;const emit=()=>{if(cb)cb(clone(st.grades));};
  return {mode:'demo',
    init(onAuth){this.onAuth=onAuth;setTimeout(()=>onAuth(st.session?{uid:st.session,user:(st.accounts.find(a=>a.uid===st.session)||{}).user,name:(st.accounts.find(a=>a.uid===st.session)||{}).name}:null),0);},
    async signIn(user,pass){const a=st.accounts.find(x=>x.user===user&&x.ph===H(user,pass));if(!a)throw{code:'auth/invalid-credential'};st.session=a.uid;persist();this.onAuth({uid:a.uid,user:a.user,name:a.name});},
    async signUp(name,user,pass){if(st.accounts.some(x=>x.user===user))throw{code:'auth/email-already-in-use'};const id='u'+uid();st.accounts.push({uid:id,user,ph:H(user,pass),name});st.session=id;persist();this.onAuth({uid:id,user,name});},
    async signOut(){st.session=null;persist();this.onAuth(null);},
    watch(adm,f){cb=g=>f(adm?g:(g[st.session]?{[st.session]:g[st.session]}:{}));emit();},
    async save(id,p){st.grades[id]=Object.assign(st.grades[id]||{},clone(p));persist();emit();}};
}
async function firebaseBackend(){
  const base='https://www.gstatic.com/firebasejs/10.12.2/';
  const [A,AU,F]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]);
  const app=A.initializeApp(FIREBASE_CONFIG),auth=AU.getAuth(app),db=F.getFirestore(app);
  const mail=u=>u+'@'+DOMAIN;let unsub=null;
  return {mode:'firebase',
    init(onAuth){AU.onAuthStateChanged(auth,async u=>{if(unsub){unsub();unsub=null;}
      if(!u){onAuth(null);return;}
      const user=(u.email||'').split('@')[0];let name=user;
      try{const s=await F.getDoc(F.doc(db,'users',u.uid));if(s.exists())name=s.data().name||user;}catch(e){}
      onAuth({uid:u.uid,user,name});});},
    signIn:(user,pass)=>AU.signInWithEmailAndPassword(auth,mail(user),pass),
    async signUp(name,user,pass){const c=await AU.createUserWithEmailAndPassword(auth,mail(user),pass);
      await F.setDoc(F.doc(db,'users',c.user.uid),{id:c.user.uid,name,user,role:user===ADMIN_USER?'admin':'recepcion',active:true,practice:[],created:Date.now()},{merge:true});},
    signOut:()=>AU.signOut(auth),
    watch(adm,f){const q=adm?F.collection(db,'grades'):null;
      unsub=adm?F.onSnapshot(q,s=>{const m={};s.forEach(d=>m[d.id]=d.data());f(m);},e=>console.error(e))
               :F.onSnapshot(F.doc(db,'grades',auth.currentUser.uid),s=>f(s.exists()?{[s.id]:s.data()}:{}),e=>console.error(e));},
    save:(id,p)=>F.setDoc(F.doc(db,'grades',id),clone(p),{merge:true})};
}



/* ---------- Estado ---------- */
let B=null,ME=null,G={},tab='in';
const isAdmin=()=>!!ME&&ME.user===ADMIN_USER;
let toastT;
function toast(m,err){const o=document.querySelector('.toast');if(o)o.remove();const t=document.createElement('div');t.className='toast'+(err?' err':'');t.textContent=m;document.body.appendChild(t);clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),err?5000:3000);}
const shell=i=>`<div class="wrap"><div class="card"><div class="brand">Tablero de notas<span>San Buenaventura Hostel Boutique</span></div>${i}</div></div>`;

const ACT=[
 {k:'diag',n:'Taller diagnóstico',s:'Diagnóstico',get:g=>g.diag&&g.diag.res?g.diag.res.pct:null},
 {k:'carpeta',n:'La Carpeta Caótica',s:'Carpeta',get:g=>g.carpeta?g.carpeta.pct:null},
 {k:'plantillas',n:'Mis plantillas',s:'Plantillas',get:g=>g.plantillas?g.plantillas.pct:null},
 {k:'retos',n:'Retos del sistema',s:'Retos',get:g=>{const a=g.auto;if(!a)return null;const t=Object.keys(a).length;if(!t)return null;return Math.round(100*Object.values(a).filter(Boolean).length/t);}}
];
const puntaje=g=>{const v=ACT.map(a=>a.get(g)||0);return Math.round(v.reduce((x,y)=>x+y,0)/ACT.length);};
const pendientes=g=>ACT.filter(a=>a.get(g)==null).map(a=>a.n);
const escritas=g=>{const t=g.teacher||{};const k=Object.keys(t).filter(x=>t[x]!=null&&t[x]!=='');return k.length?(k.reduce((s,x)=>s+(+t[x]||0),0)/k.length):null;};
const nota5=p=>(1+4*p/100).toFixed(1);
const medalla=i=>i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1)+'º';

function lista(){
  return Object.values(G).filter(g=>g&&g.user&&g.user!==ADMIN_USER)
   .map(g=>Object.assign({},g,{pts:puntaje(g)}))
   .sort((a,b)=>b.pts-a.pts||(a.name||'').localeCompare(b.name||''));
}
function render(){
  const root=document.getElementById('root');
  if(!B){root.innerHTML=shell('<p class="muted">Conectando…</p>');return;}
  if(!ME){renderLogin();return;}
  if(isAdmin())return renderAdmin();
  return renderYo();
}
function renderLogin(){
  document.getElementById('root').innerHTML=shell(`<div class="tabs"><button data-act="tab" data-t="in" aria-selected="${tab==='in'}">Ingresar</button><button data-act="tab" data-t="up" aria-selected="${tab==='up'}">Crear cuenta</button></div>
  ${tab==='in'?`<form data-form="login" class="stack"><label>Usuario<input name="user" autocapitalize="none" required></label><label>Contraseña<input name="pass" type="password" required></label><p class="err"></p><button class="btn">Ingresar</button></form>`
  :`<form data-form="signup" class="stack"><label>Nombre completo<input name="name" required></label><label>Usuario<input name="user" autocapitalize="none" required></label><label>Contraseña<input name="pass" type="password" required></label><label>Repite la contraseña<input name="pass2" type="password" required></label><p class="err"></p><button class="btn">Crear cuenta</button></form>`}
  <div class="hint">Entra con el mismo usuario de siempre.</div>`);
}
const head=t=>`<header class="top"><div><b>${t}</b><small>${esc(ME.name)}</small></div><span>${isAdmin()?'<button class="btn ghost sm" data-act="export">Exportar</button> ':''}<button class="btn ghost sm" data-act="logout">Salir</button></span></header>`;
function barra(p,etq){return `<div class="br"><span class="et">${etq}</span><div class="tk"><div class="fl" style="width:${p==null?0:p}%"></div></div><b>${p==null?'—':p+'%'}</b></div>`;}
function renderYo(){
  const g=G[ME.uid]||{},p=puntaje(g),pend=pendientes(g),esc5=escritas(g);
  document.getElementById('root').innerHTML=`<div class="page">${head('Mi avance')}<main class="content">
  <section class="q hero"><b class="big">${nota5(p)}</b><p>Tu nota de actividades, de 1.0 a 5.0. Va subiendo a medida que completas cada cosa.</p></section>
  <section class="q"><b>Lo que llevas</b>${ACT.map(a=>barra(a.get(g),a.n)).join('')}
   ${esc5!=null?`<p class="muted" style="margin-top:10px">Respuestas escritas calificadas por el profesor: <b>${esc5.toFixed(1)}</b></p>`:''}</section>
  ${pend.length?`<section class="q"><b>Te falta</b>${pend.map(x=>`<div class="rev"><span class="ic bad">!</span><div><b>${esc(x)}</b><small>Entra al menú y complétala</small></div></div>`).join('')}</section>`
   :'<section class="q"><b>¡Estás al día!</b><p class="muted">Completaste todas las actividades. Puedes repetir las que quieras para mejorar.</p></section>'}
  </main></div>`;
}
function renderAdmin(){
  const L=lista();
  const prom=L.length?Math.round(L.reduce((s,g)=>s+g.pts,0)/L.length):0;
  const alDia=L.filter(g=>!pendientes(g).length).length;
  const porAct=ACT.map(a=>({n:a.n,c:L.filter(g=>a.get(g)!=null).length}));
  document.getElementById('root').innerHTML=`<div class="page">${head('Tablero de notas')}<main class="content">
  <div class="kpis"><div class="kpi"><b>${L.length}</b><small>Estudiantes</small></div><div class="kpi"><b>${prom}%</b><small>Promedio del grupo</small></div><div class="kpi"><b>${nota5(prom)}</b><small>Nota promedio</small></div><div class="kpi"><b>${alDia}</b><small>Al día con todo</small></div></div>
  <section class="q"><b>Cuántos han hecho cada actividad</b>${porAct.map(a=>barra(L.length?Math.round(100*a.c/L.length):0,a.n+' ('+a.c+' de '+L.length+')')).join('')}</section>
  <section class="q scroll"><b>Ranking</b>
   <table class="tbl"><thead><tr><th></th><th>Estudiante</th>${ACT.map(a=>`<th class="num">${esc(a.s)}</th>`).join('')}<th class="num">Escritas</th><th class="num">Puntaje</th><th class="num">Nota</th></tr></thead><tbody>
   ${L.map((g,i)=>{const e=escritas(g);return `<tr><td><b>${medalla(i)}</b></td><td><b>${esc(g.name||g.user)}</b><br><small>${esc(g.user||'')}</small></td>
    ${ACT.map(a=>{const v=a.get(g);return `<td class="num ${v==null?'falta':''}">${v==null?'—':v+'%'}</td>`;}).join('')}
    <td class="num">${e==null?'—':e.toFixed(1)}</td><td class="num"><b>${g.pts}%</b></td><td class="num"><b>${nota5(g.pts)}</b></td></tr>`;}).join('')||'<tr><td colspan="9" class="empty">Todavía no hay actividad registrada.</td></tr>'}
   </tbody></table></section>
  <section class="q"><b>Quién tiene pendientes</b>
   ${L.filter(g=>pendientes(g).length).map(g=>`<div class="rev"><span class="ic bad">${pendientes(g).length}</span><div><b>${esc(g.name||g.user)}</b><small>Le falta: ${esc(pendientes(g).join(', '))}</small></div></div>`).join('')||'<p class="muted">Nadie tiene pendientes.</p>'}</section>
  </main></div>`;
}
const ACTS={
 tab(el){tab=el.dataset.t;render();},
 logout(){B.signOut();},
 export(){const L=lista();
  const rows=[['Puesto','Estudiante','Usuario'].concat(ACT.map(a=>a.n),['Escritas','Puntaje %','Nota','Pendientes'])]
   .concat(L.map((g,i)=>{const e=escritas(g);return [i+1,g.name||'',g.user||''].concat(ACT.map(a=>{const v=a.get(g);return v==null?'':v}),[e==null?'':e.toFixed(1),g.pts,nota5(g.pts),pendientes(g).join(' / ')]);}));
  const tsv=rows.map(r=>r.join('\t')).join('\n');
  document.getElementById('modal').innerHTML=`<div class="backdrop" data-act="close"><div class="card"><b>Exportar a Excel</b><p class="muted">Copia y pega en la celda A1.</p><textarea id="tsv" rows="9" readonly>${esc(tsv)}</textarea><div class="row2"><button class="btn ghost" data-act="close">Cerrar</button><button class="btn" data-act="copy">Copiar</button></div></div></div>`;},

 {id:'c3',ok:1,t:'Nacionalidad'},{id:'c4',ok:1,t:'Fecha de nacimiento'},
 {id:'c5',ok:1,t:'Ciudad de procedencia'},{id:'c6',ok:1,t:'Motivo del viaje'},
 {id:'c7',ok:1,t:'Teléfono de contacto'},{id:'c8',ok:1,t:'Fechas de entrada y salida'},
 {id:'c9',ok:1,t:'Autorización de tratamiento de datos'},
 {id:'x1',ok:0,t:'Estado civil',why:'No es obligatorio y no le sirve al hotel.'},
 {id:'x2',ok:0,t:'Salario del huésped',why:'Dato sensible que nadie debe pedir.'},
 {id:'x3',ok:0,t:'Redes sociales',why:'No se exige para el registro.'}];
const EJEMPLO={nombre:'Laura Pérez',entrada:'12 de octubre de 2026',salida:'15 de octubre de 2026',tipo:'Doble estándar',personas:'2',noches:'3',total:'$540.000'};

let P=null;
function nuevo(){P={fase:'intro',sel:{},campos:{},saludo:'',firma:'',res:null};}
nuevo();

function render(){
  const root=document.getElementById('root');
  if(!B){root.innerHTML=shell('<p class="muted">Conectando…</p>');return;}
  if(!ME){renderLogin();return;}
  if(isAdmin()&&!preview){renderAdmin();return;}
  const g=G[ME.uid]&&G[ME.uid].plantillas;
  if(g&&P.fase==='intro'&&!P.res){P.res=g;P.fase='fin';}
  if(P.fase==='intro')return renderIntro();
  if(P.fase==='bloques')return renderBloques();
  if(P.fase==='firma')return renderFirma();
  if(P.fase==='campos')return renderCampos();
  return renderFin();
}
function renderLogin(){
  document.getElementById('root').innerHTML=shell(`<div class="tabs"><button data-act="tab" data-t="in" aria-selected="${tab==='in'}">Ingresar</button><button data-act="tab" data-t="up" aria-selected="${tab==='up'}">Crear cuenta</button></div>
  ${tab==='in'?`<form data-form="login" class="stack"><label>Usuario<input name="user" autocapitalize="none" required></label><label>Contraseña<input name="pass" type="password" required></label><p class="err"></p><button class="btn">Ingresar</button></form>`
  :`<form data-form="signup" class="stack"><label>Nombre completo<input name="name" required></label><label>Usuario (sin espacios ni tildes)<input name="user" autocapitalize="none" required></label><label>Contraseña<input name="pass" type="password" required></label><label>Repite la contraseña<input name="pass2" type="password" required></label><p class="err"></p><button class="btn">Crear cuenta</button></form>`}
  <div class="hint">Entra con el mismo usuario de siempre.</div>`);
}
const head=()=>`<header class="top"><div><b>Mis plantillas</b><small>${esc(ME.name)}${isAdmin()?', probando la actividad':''}</small></div><span>${isAdmin()?'<button class="btn ghost sm" data-act="panel">Ver resultados</button> ':''}<button class="btn ghost sm" data-act="logout">Salir</button></span></header>`;
function renderIntro(){
  document.getElementById('root').innerHTML=`<div class="page">${head()}<main class="content">
  <section class="q hero"><b class="big">Arma tu plantilla de confirmación</b>
  <p>Vas a construir la carta que le mandas a un huésped cuando confirma su reserva, y después la tarjeta de registro. Todo desde el celular.</p>
  <ol class="steps"><li>Escoges los bloques que sí deben ir</li><li>Escribes tu saludo y tu firma</li><li>Marcas los datos obligatorios del registro</li><li>Copias tu plantilla y la guardas en Google Docs o en Notas</li></ol>
  <button class="btn big" data-act="ir" data-f="bloques">Empezar</button></section></main></div>`;
}
function renderBloques(){
  const n=Object.values(P.sel).filter(Boolean).length;
  document.getElementById('root').innerHTML=`<div class="page">${head()}<main class="content">
  <div class="racehead"><b>1. Escoge los bloques</b><span class="muted">${n} escogidos</span></div>
  <p class="muted">Toca los que sí deben ir en una confirmación. Ojo: hay tres que no deberían estar nunca.</p>
  ${BLOQUES.map(b=>`<button class="bloque ${P.sel[b.id]?'on':''}" data-act="bloque" data-id="${b.id}"><b>${esc(b.t)}</b><span>${esc(b.txt)}</span></button>`).join('')}
  <button class="btn big" data-act="ir" data-f="firma" ${n?'':'disabled'}>Seguir</button></main></div>`;
}
function renderFirma(){
  document.getElementById('root').innerHTML=`<div class="page">${head()}<main class="content">
  <div class="racehead"><b>2. Tu saludo y tu firma</b></div>
  <p class="muted">Usa <code>{nombre}</code> donde vaya el nombre del huésped. Así el texto sirve para todos.</p>
  <section class="q"><label>Saludo</label><input class="entrada" id="saludo" value="${esc(P.saludo)}" placeholder="Buenas tardes, {nombre}. Gracias por escribirnos."></section>
  <section class="q"><label>Firma</label><input class="entrada" id="firma" value="${esc(P.firma)}" placeholder="Recepción, Hotel San Buenaventura. Tel. 300 000 0000"></section>
  <button class="btn big" data-act="ir" data-f="campos">Seguir</button></main></div>`;
}
function renderCampos(){
  const n=Object.values(P.campos).filter(Boolean).length;
  document.getElementById('root').innerHTML=`<div class="page">${head()}<main class="content">
  <div class="racehead"><b>3. Tarjeta de registro</b><span class="muted">${n} marcados</span></div>
  <p class="muted">Marca solo los datos que el hotel sí debe pedirle al huésped.</p>
  <div class="campos">${CAMPOS.map(c=>`<button class="campo ${P.campos[c.id]?'on':''}" data-act="campo" data-id="${c.id}">${esc(c.t)}</button>`).join('')}</div>
  <button class="btn big" data-act="terminar">Terminar y ver mi plantilla</button></main></div>`;
}
function armarTexto(){
  const l=[];
  l.push(P.saludo.trim()||'Buenas tardes, {nombre}.');
  BLOQUES.forEach(b=>{if(P.sel[b.id]&&b.id!=='b1')l.push(b.txt);});
  l.push(P.firma.trim()||'Recepción, Hotel San Buenaventura.');
  return l.join('\n');
}
function llenar(t){return t.replace(/\{(\w+)\}/g,(m,k)=>EJEMPLO[k]||m);}
function evaluar(){
  let bien=0,mal=0;BLOQUES.forEach(b=>{const s=!!P.sel[b.id];if(b.ok&&s)bien++;if(!b.ok&&s)mal++;});
  let cb=0,cm=0;CAMPOS.forEach(c=>{const s=!!P.campos[c.id];if(c.ok&&s)cb++;if(!c.ok&&s)cm++;});
  const saludoOk=/\{nombre\}/.test(P.saludo)||/\{nombre\}/.test(BLOQUES[0].txt)&&P.sel.b1;
  const firmaOk=(P.firma.trim().length>8);
  const totalPts=6+3+9+3+2;
  const pts=bien+(3-mal)+cb+(3-cm)+(saludoOk?1:0)+(firmaOk?1:0);
  const pct=Math.round(100*pts/totalPts);
  return {bien,mal,cb,cm,saludoOk,firmaOk,pct,texto:armarTexto(),ts:Date.now(),
    medalla:pct>=90?'Excelente':pct>=70?'Buena':pct>=50?'Aceptable':'Hay que reforzar'};
}
function renderFin(){
  const r=P.res,txt=r.texto||armarTexto();
  document.getElementById('root').innerHTML=`<div class="page">${head()}<main class="content">
  <section class="q hero"><b class="big">${r.medalla}</b><p>Puntaje ${r.pct}%. Bloques correctos ${r.bien} de 6, campos correctos ${r.cb} de 9.${r.mal||r.cm?' Incluiste '+(r.mal+r.cm)+' que no debían ir.':''}</p></section>
  <section class="q"><b>Tu plantilla</b><pre class="salida" id="tpl">${esc(txt)}</pre>
   <div class="row2"><button class="btn ghost" data-act="copiar">Copiar plantilla</button><button class="btn ghost" data-act="ejemplo">Ver llena con un huésped</button></div></section>
  <section class="q"><b>Revisión</b>
   ${BLOQUES.map(b=>{const s=!!P.sel[b.id],ok=b.ok?s:!s;
     return `<div class="rev"><span class="ic ${ok?'ok':'bad'}">${ok?'✓':'✗'}</span><div><b>${esc(b.t)}</b><small>${b.ok?(s?'Bien, es parte de la confirmación':'Faltó: sin esto la confirmación queda incompleta'):(s?'No debía ir. '+esc(b.why):'Bien, no debía ir')}</small></div></div>`;}).join('')}
   ${CAMPOS.filter(c=>c.ok?!P.campos[c.id]:P.campos[c.id]).map(c=>`<div class="rev"><span class="ic bad">✗</span><div><b>${esc(c.t)}</b><small>${c.ok?'Es obligatorio en la tarjeta de registro':'No debía pedirse. '+esc(c.why)}</small></div></div>`).join('')}
  </section>
  <section class="q"><b>Guárdala</b><p class="muted">Copia tu plantilla y pégala en Google Docs o en las Notas del celular. Nómbrala <code>2026-10-01_plantilla_confirmacion</code>.</p></section>
  <button class="btn ghost" data-act="otra">Volver a hacerla</button></main></div>`;
}
function renderAdmin(){
  const list=Object.values(G).filter(g=>g&&g.plantillas&&g.user!==ADMIN_USER).sort((a,b)=>b.plantillas.pct-a.plantillas.pct);
  const prom=list.length?Math.round(list.reduce((s,g)=>s+g.plantillas.pct,0)/list.length):0;
  document.getElementById('root').innerHTML=`<div class="page"><header class="top"><div><b>Mis plantillas</b><small>Resultados</small></div><span><button class="btn ghost sm" data-act="try">Hacer la actividad</button> <button class="btn ghost sm" data-act="export">Exportar</button> <button class="btn ghost sm" data-act="logout">Salir</button></span></header>
  <main class="content">${!list.length?'<p class="muted">Todavía nadie la ha hecho.</p>':`
  <div class="kpis"><div class="kpi"><b>${list.length}</b><small>La han hecho</small></div><div class="kpi"><b>${prom}%</b><small>Promedio</small></div></div>
  ${list.map(g=>{const p=g.plantillas;return `<section class="q"><b>${esc(g.name||g.user)} — ${p.medalla} (${p.pct}%)</b>
   <small class="muted">Bloques ${p.bien}/6 · Campos ${p.cb}/9 · Sobrantes ${(p.mal||0)+(p.cm||0)}</small>
   <pre class="salida">${esc(p.texto||'')}</pre></section>`;}).join('')}`}</main></div>`;
}
const ACTS={
 tab(el){tab=el.dataset.t;render();},
 logout(){B.signOut();},
 panel(){preview=false;render();},
 try(){preview=true;nuevo();render();},
 ir(el){if(P.fase==='firma'){P.saludo=(document.getElementById('saludo')||{}).value||P.saludo;P.firma=(document.getElementById('firma')||{}).value||P.firma;}
  P.fase=el.dataset.f;render();},
 bloque(el){const id=el.dataset.id;P.sel[id]=!P.sel[id];render();},
 campo(el){const id=el.dataset.id;P.campos[id]=!P.campos[id];render();},
 async terminar(){P.res=evaluar();P.fase='fin';render();
  const p={id:ME.uid,name:ME.name,user:ME.user,plantillas:P.res};
  G[ME.uid]=Object.assign(G[ME.uid]||{},p);
  try{await B.save(ME.uid,p);}catch(e){toast(errMsg(e),true);}},
 otra(){nuevo();render();},
 ejemplo(){const t=document.getElementById('tpl');t.textContent=llenar(P.res.texto||armarTexto());toast('Así le llega al huésped');},
 copiar(){const t=document.getElementById('tpl').textContent;
  const fin=ok=>toast(ok?'Plantilla copiada. Pégala en Google Docs o en Notas.':'Selecciónala y cópiala a mano.',!ok);
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>fin(true),()=>fin(false));else fin(false);},
 export(){const list=Object.values(G).filter(g=>g&&g.plantillas&&g.user!==ADMIN_USER);
  const rows=[['Estudiante','Usuario','Medalla','Puntaje %','Bloques','Campos','Sobrantes','Plantilla']].concat(list.map(g=>{const p=g.plantillas;return [g.name||'',g.user||'',p.medalla,p.pct,p.bien+'/6',p.cb+'/9',(p.mal||0)+(p.cm||0),(p.texto||'').replace(/\n/g,' | ')];}));
  const tsv=rows.map(r=>r.join('\t')).join('\n');
  document.getElementById('modal').innerHTML=`<div class="backdrop" data-act="close"><div class="card"><b>Exportar a Excel</b><p class="muted">Copia y pega en la celda A1.</p><textarea id="tsv" rows="9" readonly>${esc(tsv)}</textarea><div class="row2"><button class="btn ghost" data-act="close">Cerrar</button><button class="btn" data-act="copytsv">Copiar</button></div></div></div>`;},
 close(el,e){if(el.classList.contains('backdrop')&&e.target!==el)return;document.getElementById('modal').innerHTML='';},
 copytsv(){const t=document.getElementById('tsv');t.focus();t.select();let ok=false;try{ok=document.execCommand('copy');}catch(e){}
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t.value).then(()=>toast('Datos copiados'),()=>toast(ok?'Datos copiados':'Cópialo con Ctrl+C',!ok));else toast(ok?'Datos copiados':'Cópialo con Ctrl+C',!ok);}
};
const err=(f,m)=>{const e=f.querySelector('.err');if(e)e.textContent=m;};
const FORMS={
 async login(d,f){try{await B.signIn(d.user.trim().toLowerCase(),d.pass);}catch(e){err(f,errMsg(e));}},
 async signup(d,f){const name=d.name.trim();const user=d.user.trim().toLowerCase().replace(/\s+/g,'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/^[._-]+|[._-]+$/g,'');
  if(!name)return err(f,'Escribe tu nombre.');
  if(!/^[a-z0-9]([a-z0-9._-]{1,28})?[a-z0-9]$/.test(user))return err(f,'El usuario debe empezar y terminar con letra o número, sin espacios ni tildes. Ejemplo: ana.lucia');
  if(d.pass.length<6)return err(f,'La contraseña debe tener al menos 6 caracteres.');
  if(d.pass!==d.pass2)return err(f,'Las contraseñas no coinciden.');
  try{await B.signUp(name,user,d.pass);}catch(e){err(f,errMsg(e));}}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=ACTS[el.dataset.act];if(f){e.stopPropagation();f(el,e);}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,d={};new FormData(f).forEach((v,k)=>{d[k]=v;});const id=f.dataset.form;if(FORMS[id])FORMS[id](d,f);});
document.addEventListener('input',e=>{if(e.target.id==='saludo')P.saludo=e.target.value;if(e.target.id==='firma')P.firma=e.target.value;});
async function boot(){
  render();
  try{B=FIREBASE_CONFIG.apiKey?await firebaseBackend():demoBackend();}
  catch(e){console.error(e);document.getElementById('root').innerHTML=shell('<p>No se pudo conectar.</p>');return;}
  B.init(u=>{ME=u;G={};preview=false;tab='in';nuevo();render();if(u)B.watch(u.user===ADMIN_USER,g=>{G=Object.assign(G,g);render();});});
}
boot();
})();

<\/script>
</body>

</script><script type="text/plain" id="app-clase-plantillas"><!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#0A2E36">
<title>Plantillas: carta de confirmación y tarjeta de registro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --noche:#0A2E36;--mar:#12878F;--espuma:#8FD3D0;--cal:#FBF6EE;--arena:#F0E6D6;
  --buganvilia:#C63A5E;--mostaza:#E8A33D;--tinta:#0E2226;--humo:#6B8085;
  --ff-d:"Bricolage Grotesque",Georgia,serif;--ff-b:Manrope,system-ui,sans-serif;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--noche)}
body{font-family:var(--ff-b);color:var(--tinta);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--mostaza);outline-offset:3px}

#deck{height:100%;position:relative;overflow:hidden}
.rail{position:absolute;top:0;left:0;right:0;height:4px;background:rgba(255,255,255,.18);z-index:9}
.rail i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mostaza),var(--espuma));transition:width .5s cubic-bezier(.22,1,.36,1)}
.slide{position:absolute;inset:0;overflow:auto;display:none;padding:clamp(26px,5vh,64px) clamp(20px,6vw,88px) 104px}
.slide.on{display:block}
.slide.light{background:var(--cal);color:var(--tinta)}
.slide.dark{background:radial-gradient(120% 100% at 80% 0%,#134651 0%,var(--noche) 60%);color:var(--cal)}
.slide.sand{background:linear-gradient(180deg,var(--arena),#F7EFE2);color:var(--tinta)}
.inner{max-width:1180px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;justify-content:center}

/* tipografía */
.eyebrow{font-family:var(--ff-b);font-weight:700;font-size:clamp(12px,1.4vw,15px);color:var(--buganvilia);margin:0 0 10px;letter-spacing:.01em}
.dark .eyebrow{color:var(--mostaza)}
h1{font-family:var(--ff-d);font-weight:800;font-size:clamp(34px,7vw,86px);line-height:.96;letter-spacing:-.03em;margin:0 0 18px}
h2{font-family:var(--ff-d);font-weight:800;font-size:clamp(26px,4.6vw,54px);line-height:1.02;letter-spacing:-.025em;margin:0 0 18px;max-width:20ch}
h3{font-family:var(--ff-d);font-weight:600;font-size:clamp(17px,2.1vw,24px);margin:0 0 4px;letter-spacing:-.01em}
p{font-size:clamp(15px,1.75vw,21px);line-height:1.55;margin:0 0 14px;max-width:58ch}
.lead{font-size:clamp(17px,2.2vw,27px);line-height:1.4;color:var(--humo);max-width:34ch}
.dark .lead{color:var(--espuma)}
.small{font-size:clamp(13px,1.4vw,16px);color:var(--humo)}
.dark .small{color:#9FC4C6}

/* entrada orquestada */
.slide.on .anim{animation:rise .62s cubic-bezier(.22,1,.36,1) both}
.slide.on .anim:nth-child(1){animation-delay:.02s}.slide.on .anim:nth-child(2){animation-delay:.1s}
.slide.on .anim:nth-child(3){animation-delay:.18s}.slide.on .anim:nth-child(4){animation-delay:.26s}
.slide.on .anim:nth-child(5){animation-delay:.34s}.slide.on .anim:nth-child(6){animation-delay:.42s}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.stagger>*{opacity:0}
.slide.on .stagger>*{animation:rise .55s cubic-bezier(.22,1,.36,1) both}
.slide.on .stagger>*:nth-child(1){animation-delay:.18s}.slide.on .stagger>*:nth-child(2){animation-delay:.26s}
.slide.on .stagger>*:nth-child(3){animation-delay:.34s}.slide.on .stagger>*:nth-child(4){animation-delay:.42s}
.slide.on .stagger>*:nth-child(5){animation-delay:.5s}.slide.on .stagger>*:nth-child(6){animation-delay:.58s}
.slide.on .stagger>*:nth-child(7){animation-delay:.66s}.slide.on .stagger>*:nth-child(8){animation-delay:.74s}

/* portada */
.hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(220px,.65fr);gap:clamp(20px,4vw,56px);align-items:center}
.hero h1{max-width:14ch}
.datos{display:flex;flex-wrap:wrap;gap:8px 28px;font-weight:600;color:var(--espuma);font-size:clamp(13px,1.5vw,18px);margin-top:6px}
.llavero{position:relative;height:clamp(180px,32vh,340px);display:grid;place-items:start center}
.llavero svg{width:clamp(120px,16vw,190px);transform-origin:50% 6%;animation:swing 5.5s ease-in-out infinite}
@keyframes swing{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}

/* tablero de llaves */
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:14px}
.hook{position:relative;text-align:left;background:var(--cal);border:1px solid rgba(14,34,38,.12);border-radius:4px 4px 16px 16px;padding:18px 20px 20px;box-shadow:0 10px 24px rgba(10,46,54,.07);transition:transform .25s cubic-bezier(.22,1,.36,1),box-shadow .25s}
.dark .hook{background:rgba(251,246,238,.06);border-color:rgba(143,211,208,.22);color:var(--cal);box-shadow:none}
.hook::before{content:"";position:absolute;top:-9px;left:24px;width:14px;height:14px;border-radius:50%;background:var(--mostaza);box-shadow:0 0 0 3px var(--cal)}
.dark .hook::before{box-shadow:0 0 0 3px var(--noche)}
.hook:hover,.hook:focus-visible{transform:translateY(-4px) rotate(-.6deg);box-shadow:0 16px 30px rgba(10,46,54,.12)}
.hook p{font-size:clamp(13px,1.5vw,17px);color:var(--humo);margin:0;max-width:34ch}
.dark .hook p{color:#A9CBCC}
.hook .reveal{display:none;margin-top:10px;font-weight:700;color:var(--buganvilia)}
.dark .hook .reveal{color:var(--mostaza)}
.hook.open .reveal{display:block;animation:rise .35s ease both}
.hook.open .pista{display:none}
.pista{margin-top:12px;font-size:13px;font-weight:700;color:var(--mar)}
.dark .pista{color:var(--espuma)}

/* cronograma */
.agenda{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(420px,100%),1fr))}
.fila{display:grid;grid-template-columns:118px 1fr;gap:4px 16px;align-items:center;padding:12px 16px;background:var(--cal);border-left:6px solid var(--mar);border-radius:0 12px 12px 0;text-align:left;width:100%}
.fila.v{border-left-color:var(--buganvilia);background:#FDF7F4}
.fila .cuando{font-family:var(--ff-d);font-weight:600;font-size:clamp(15px,1.7vw,20px)}
.fila .que{font-weight:700;font-size:clamp(14px,1.6vw,19px)}

.slide.on .arbol span{animation:linea .4s ease both}

.slide.on .arbol span:nth-child(1){animation-delay:.3s}.slide.on .arbol span:nth-child(2){animation-delay:.45s}
.slide.on .arbol span:nth-child(3){animation-delay:.6s}.slide.on .arbol span:nth-child(4){animation-delay:.75s}
.slide.on .arbol span:nth-child(5){animation-delay:.9s}.slide.on .arbol span:nth-child(6){animation-delay:1.05s}
@keyframes linea{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
.duo{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:14px;margin-top:6px}

.caja{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--mar);display:grid;place-items:center;color:transparent;font-weight:800;transition:background .2s,color .2s,transform .2s}
.check.hecho .caja{background:var(--mar);color:#fff;transform:rotate(-6deg) scale(1.05)}

/* pregunta inicial */
.opciones{display:flex;gap:12px;flex-wrap:wrap;margin:6px 0 4px}
.opciones button{background:var(--cal);border:2px solid rgba(14,34,38,.15);border-radius:14px;padding:14px 20px;font-weight:700;font-size:clamp(14px,1.6vw,19px);transition:transform .2s,border-color .2s}
.dark .opciones button{background:rgba(251,246,238,.08);border-color:rgba(143,211,208,.3);color:var(--cal)}

.opciones.resuelta button{opacity:.45}
.opciones.resuelta button.buena{opacity:1;border-color:var(--mostaza);box-shadow:0 0 0 4px rgba(232,163,61,.25)}
.sello{display:none;margin-top:18px;border:3px solid var(--buganvilia);color:var(--buganvilia);border-radius:14px;padding:14px 20px;font-family:var(--ff-d);font-weight:800;font-size:clamp(17px,2.4vw,28px);max-width:26ch;transform:rotate(-2deg)}
.sello.puesto{display:block;animation:sellar .45s cubic-bezier(.34,1.56,.64,1) both}
@keyframes sellar{from{opacity:0;transform:rotate(-2deg) scale(1.5)}}

/* cifras */
.cifras{display:flex;gap:clamp(20px,5vw,64px);flex-wrap:wrap;margin-top:10px}

/* navegación */
.nav{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:12px;padding:14px clamp(18px,5vw,48px) calc(14px + env(safe-area-inset-bottom,0px));z-index:8}

.panel .pcaja{background:var(--cal);border-radius:20px;padding:22px;width:100%;max-width:420px;max-height:92vh;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.panel h3{font-size:21px;margin-bottom:6px}
.panel p{font-size:14px;margin-bottom:4px}
.panel label{display:block;font-size:12px;font-weight:700;color:var(--humo);margin:12px 0 4px}
.panel input{width:100%;padding:11px 13px;border:1px solid rgba(14,34,38,.18);border-radius:10px;font:inherit;background:#fff}
.panel .btn{display:block;width:100%;margin-top:12px;background:var(--mar);color:#fff;border-radius:12px;padding:13px;font-weight:800}
.panel .btn.sec{background:var(--cal);color:var(--tinta);border:1px solid rgba(14,34,38,.18)}
.panel .cerrar{margin-top:10px;font-size:13px;color:var(--humo);text-decoration:underline}
.panel .err{color:var(--buganvilia);font-weight:700;font-size:13px;min-height:1em;margin-top:8px}
.dotp{position:fixed;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FF6B6B,#C1121F);box-shadow:0 0 18px 6px rgba(214,51,108,.45);pointer-events:none;z-index:30;transform:translate(-50%,-50%);display:none}

#mando{position:fixed;inset:0;background:var(--noche);color:var(--cal);z-index:50;display:none;flex-direction:column;padding:16px calc(16px + env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px))}

#mando .pad.activo{border-style:solid;border-color:var(--mostaza);color:var(--mostaza)}
#mando .fila2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#mando button{background:var(--mar);color:#fff;border-radius:14px;padding:18px;font-weight:800;font-size:17px}

}

.msg{border-radius:14px;padding:14px 16px;font-size:clamp(13px,1.6vw,18px);line-height:1.55}
.mal2{background:#FBE9EC;border:1px solid #EFC3CC;color:#93304A}

</style>
</head>
